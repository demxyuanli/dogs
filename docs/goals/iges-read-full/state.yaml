 degree + k <= idx <= n - 1. KNOT SIDE: OCCT's BuildKnots reads the flat knot array NON-cyclically; it stays in range only because LocateParameter clamps its index at 'first = Knots.Lower() + Degree' / 'last = Knots.Upper() - Degree' (BSplCLib.cxx:344-347). This flat-knot primitive clamps the span to [degree, n - 1] instead, which guarantees k0 >= 1 exactly when poles.len() >= degree + 1, so the 'poles.len() < degree + 1' configuration has no equivalent branch here: OCCT reaches its window through the distinct-knot PoleIndex (BSplCLib.cxx:1758-1779) that a flat-knot index cannot represent. It is marked UNPORTED in the comment with those citations, and the signed '.clamp(0, knots.len().saturating_sub(1))' on k0/k1 only stops the panic - it is not presented as OCCT behaviour. No curve the IGES or STEP read paths produce hits it (they satisfy poles.len() >= degree + 1), which the 14-model sweep below confirms. VERIFICATION: cargo check --manifest-path crates/occt-topo/Cargo.toml --offline = 0 errors, 357 warnings. occt-core lib tests 290 passed / 0 failed / 1 ignored, including both pre-existing bspl::eval::tests (eval_linear, eval_cubic_endpoints). step_obj_gates = 4 passed / 0 failed / 0 ignored (235.01s). 14-model sweep byte-identical to the T021 baseline. SIDE FINDINGS, reported and NOT fixed: (1) crates/occt-core/src/bspl/knots.rs:80-83 check_degree only asserts n_knots == n_poles + degree + 1 and never relates n_poles to degree, so the degenerate configuration is constructible in the port exactly as OCCT allows it - that mirrors OCCT and is not itself a defect; only the arithmetic was wrong. (2) clippy would not have caught this because the subtraction is in range-checked release code; nothing in the crate evaluates a curve with poles.len() <= degree today."
