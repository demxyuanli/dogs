Verification: cargo check --all-targets = 0 errors, 399 warnings, and cargo test --manifest-path crates/occt-topo/Cargo.toml --offline --lib = 1276 passed. No OBJ was written into the three protected data/output paths and full_outcome_complete was not touched."
