    receipt:
      summary: "PREMISE REFUTED; the attempted fix was reverted. T023's claim that IntTools_Tools::CheckCurve reads a range the port passes differently was WRONG, and the port was already faithful. WHAT IntTools_Curve ACTUALLY HOLDS: the class stores no parameter range at all (IntTools_Curve.hxx:84 exposes only 'const occ::handle<Geom_Curve>& Curve() const { return my3dCurve; }'; HasBounds/Bounds at :99-108 derive from the curve), and for a line intersection IntTools_FaceFace puts a BOUNDED curve in it - 'occ::handle<Geom_Line> aGLin = new Geom_Line(aLin); occ::handle<Geom_TrimmedCurve> aGTLin = new Geom_TrimmedCurve(aGLin, pmin, pmax); aCurve.SetCurve(aGTLin);' (IntTools_FaceFace.cxx:2511-2516) with 'pmin = std::max(P11, P21); pmax = std::min(P12, P22);' (the common parametric interval, :2501-2507) and the same Geom_TrimmedCurve wrapping at :814-815, :1025-1026, :1080-1081, or an already-finite periodic curve at :1110-1122 (a full circle sampled at 17 points). GeomAdaptor_Curve::Load(theCurve) then takes the range from 'theCurve->FirstParameter()/LastParameter()' (GeomAdaptor_Curve.hxx:117-124) and 'load' unwraps Geom_TrimmedCurve to its BASIS while keeping that interval (GeomAdaptor_Curve.cxx:252-254), so CheckCurve bounds exactly pmin..pmax. No open box is ever produced for these curves, and no unbounded line ever reaches it. WHY THE PORT WAS RIGHT ANYWAY: the port splits that same information across two fields - FaceFaceCurve.range holds the valid window (int_face_face.rs:55, 'Parameter range [first, last] over which the curve is valid') while c.curve is the UNTRIMMED basis. Instrumented: 'T024DBG kind=Line range=[-0.13052619222004197,0.1305261922202013] own=[-inf,inf] no-trim-wrapper' for the groove, 'range=[-1,0] / [0,1] own=[-inf,inf]' for box-box. So 'check_curve(c.curve, r.first, r.last, ...)' is the exact counterpart of OCCT's trimmed adaptor range, and the baseline body was already aligned. THE EXPERIMENT: substituting the curve's own range (check_curve reading c.first_parameter()/c.last_parameter()) made 'boolean_split_result_cut_two_pieces' pass but FAILED both 'brepfeat::tests::groove_cuts_cylinder' ('groove must remove material: after 9.317485623690741 < before 9.317485623690741', brepfeat/tests.rs:98) and 'brepfeat::tests::groove_negative_volume_delta' ('groove changes the volume (delta 0)', :222) - the own range is +/-inf, so the box went open and the groove stopped cutting. Those tests assert plain geometry (a cut must cut, a groove must remove material), not a curve-filtering artefact, so the new output was wrong. REVERTED: 'rtk git checkout -- crates/occt-topo/src/int_tools_curve_box.rs crates/occt-topo/src/pave_ff_perform.rs' and the T024DBG probe removed ('rg -c T024DBG crates -g *.rs' empty); pave_ff_perform.rs is byte-identical to HEAD. TWO GENUINE DEFECTS FOUND AND FIXED INSTEAD (both cxx-cited, both measured, both touching only the box primitives the audit was alread inside): (1) crates/occt-core/src/bnd/box3d.rs::add_point did not match Bnd_Box::Add(const gp_Pnt&) -> Bnd_Box::Update (Bnd_Box.cxx:610-615, :182-203). OCCT's void branch clears ONLY VoidMask ('Flags &= ~VoidMask') and its non-void branch is a plain 'Xmin = std::min(Xmin, X); ... Xmax = std::max(Xmax, X);' that never touches the flags; the port did 'self.flags = 0;' and then, in the non-void branch, cleared the open-direction flag of every axis it touched. That made box_lin's infinite arm unusable: GeomBndLib_Line::Box does 'OpenMinMax(dir, aBox); aBox.Add(ElCLib::Value(0., theLin));' (GeomBndLib_Line.hxx:69-80), i.e. it adds a point to an open box, and the port collapsed that into a degenerate point box (now matches: 'own_open=true'). (2) crates/occt-topo/src/int_tools_curve_box.rs::add_curve_to_box carried a 'finite_or_unit' helper that rewrote a non-finite bound to the curve's own FirstParameter()/LastParameter() and a degenerate window to (-1.0, 1.0). Neither rule exists anywhere in GeomBndLib, and the (-1.0, 1.0) arm replaced an open box with a unit segment box, which flips Bnd_Box::IsThin (Bnd_Box.cxx:398-421). It is removed and the window is forwarded unchanged, so the ported arms geom_bnd_lib_curve3d::{box_lin, box_hyperbola_range, box_parabola_range} can fire. VERIFICATION AT THE FINAL STATE (private CARGO_TARGET_DIR _tmp/tgt_t023): cargo check --manifest-path crates/occt-topo/Cargo.toml --offline --all-targets = 0 errors; occt-topo lib = 'test result: ok. 1276 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 70.31s' (identical count to the pre-task baseline); occt-core lib = '290 passed; 0 failed; 1 ignored'; step_obj_gates = '4 passed; 0 failed' (cylinder_step_mesh_covers_full_u_period, step_obj_parity_bboxes_match_occt, step_to_obj_exports_valid_obj, step_obj_area_matches_occt); export_data_obj = all 15 'ok' lines with the baseline numbers (Cone 195/301, Cube 24/12, Cylinder 146/140, Extrusion 24/12, HoledPlate 180/128, Offset 712/892, OffsetPlaneHoleEdge 48/32, Shape-1 3335/4328); 14-model IGES sweep byte-identical to the T021/T022/T023 baseline (Cone 863/1644, Cylinder 164/158, Sphere 1725/3410, Cube 24/12, Torus 302/146, rev 104/92, Offset 672/812, Extrusion 24/12, HoledPlate 180/128, OffsetPlaneHoleEdge 40/24, screw 502/602, Shape 7191/13433, Shape-1 6498/10644, Shape-2 3037/4691). A/B for attribution, each side a private target: the add_point fix ALONE is inert on the three tests ('test result: ok. 3 passed'); reintroducing the finite_or_unit window rewrite on top of the own-range change restores '3 passed', which is what pinned the groove failure to the open-box arm rather than to the range source. SIDE FINDINGS, reported and NOT fixed: (1) BndBox::add_box does not follow Bnd_Box::Add(const Bnd_Box&) (Bnd_Box.cxx:516-550): OCCT runs 'Gap = std::max(Gap, Other.Gap);' BEFORE the IsWhole/IsVoid early returns, so the gap is still absorbed when self is whole, while the port returns first and does the gap merge last; the flag OR-ing that follows is otherwise equivalent. (2) Because of (1)'s sibling defect the ported infinite-parameter arms of GeomBndLib were dead code until now - any caller that passes a non-finite window is now handled by the real OpenMin/OpenMax/OpenMinMax path instead of the (-1.0, 1.0) substitution, which is a behaviour change on a path no current test exercises. (3) T023's audit conclusion that the T021 divergence class is unique among REACHABLE port paths still stands on its own evidence; only its 'opposite divergence' paragraph is withdrawn, and the T023 receipt now carries a correction pointing here. No source file outside the three listed was touched; nothing was exported into data/output/iges-occ, iges-read or iges-read-fixshape, full_outcome_complete was not set and graphify label was not run."
