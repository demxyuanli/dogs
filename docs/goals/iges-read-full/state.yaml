      summary: "T033 RE-VERIFIED ON THE CURRENT TREE, AND ONE OF ITS PROBE-SIDE NUMBERS IS CORRECTED. (1) New module crates/occt-topo/src/shape_upgrade/c0_bspline_sequence.rs follows ShapeUpgrade::C0BSplineToSequenceOfC1BSplineCurve exactly: the 3D overload (ShapeUpgrade.cxx:40-130) gates on BS.IsNull() || BS->IsCN(1) (:42-47), copies with SetNotPeriodic so NbPoles = sum(mults) - degree - 1 (:49-50), walks EndKnotIndex from FirstUKnotIndex + 1 skipping while Mults(End) < deg and End < LastUKnotIndex (:61-66), rebuilds TempKnots/TempMults over [StartFlatIndex - deg, EndFlatIndex + deg] merging runs within gp::Resolution() (:73-91), raises unit end multiplicities (:92-99), slices the piece (:101-109), takes NewNbPoles poles and weights from PoleIndex = StartFlatIndex - deg (:111-120) and constructs Geom_BSplineCurve (:122-126) whose static Rational (Geom_BSplineCurve.cxx:98-109, consecutive-neighbour abs difference against gp::Resolution, identical at Geom2d_BSplineCurve.cxx:95-105) decides whether the piece stays rational. The 2D overload (:174-194) goes through BSplineCurve2dTo3d (:134-152, z = 0, keeps the periodic flag) and BSplineCurve3dTo2d (:154-172); the port shares one split body for both. The pluggable hook is ShapeAlgo_AlgoContainer.cxx:636-650. (2) Wiring: transfer_topo_basic_curve runs the arm at the cxx:1015-1018 guard (IsKind Geom_BSplineCurve && Continuity() < GeomAbs_C1 && GetContinuity() >= 1), calls it at cxx:1022, builds one edge per piece (cxx:1023-1037) and joins the pieces with ShapeFix_Wire::FixConnected (cxx:1059-1064); edges_from_2d_basic runs the same arm at cxx:1232-1237 and calls it at cxx:1238. The gate is the port constant CONTINUITY in iges_read/iges_to_brep_topo_curve.rs, i.e. read.iges.bspline.continuity (IGESData.cxx:66-68, default 1, range 0..2). (3) A/B proof that this arm is what moves screw.iges: with the constant at 0 (the same knob OCCT reads) screw.iges is 499/596 and with it at 1 it is 500/597, while the probe is 500/597; the other thirteen models give identical face totals either way, so screw.iges is the only oracle file of the fourteen that reaches this arm. (4) BASELINE CORRECTION, read this before the numbers: T032 ran the probe with a rounded lin (0.308, 0.448426, 0.04, 0.6) while the port always meshes at its own 17-digit lin. The probe's --bbox prints exactly the lin OCCT itself would use (maxComp * 0.001 * 4, occt_probe.cpp:4806-4811) and it is bit-identical to the port's printed lin: Shape-1 3.08000000799999951e-01, Shape 4.48425899416000029e-01, Cone 4.00000007999999976e-02, Shape-2 6.00000000800113953e-01, screw 1.69199450333597318e-01. Re-running the probe with those 17-digit values changes the probe's own answer: Shape-1 sums 3055/3758 (not 3053/3754), Shape 7191/13433 (not 7192/13435), Cone 862/1642 (not 863/1644), Shape-2 3022/4661 (not 3033/4683); each value is stable over two runs. So T032's Shape-1 Bezier face (+2/+4) and Shape Offset face (-1/-2) were a rounded-lin artefact of the comparison, not port defects, and the port side was never mis-measured. (5) Sweep at OCCT's own lin, faces paired on the six printed bbox coordinates and never by index: EXACT on Cube 24/12, Sphere 1725/3410, Cylinder 164/158, Extrusion 24/12, HoledPlate 180/128, Offset 672/812, OffsetPlaneHoleEdge 40/24, rev 104/92, Torus 302/146, screw 500/597 (10/10 faces), Shape-1 3055/3758 (60/60 faces) and Shape 7191/13433 (11/11 faces). (6) TWO RESIDUALS REMAIN AND ONLY ONE OF THEM IS A CLEAN READING. Cone: port 863/1644 against probe 862/1642, one node / two triangles on the revolution side face (port face 0 827/1610 against the probe's 826/1608; the planar cap is 36/34 on both sides, so the model totals agree while the split between the two faces does not). Shape-2: port 3037/4691 against 3022/4661, eleven faces, net +15/+30 - and this is where T033 is corrected. T033 recorded the probe as 3033/4683 and called the model deflection-invariant on the strength of 0.6 and 0.6000000008 agreeing; on the current probe build (2026-10-13 08:29, MD5 51A2B1FA4167D7572179987BA98893A3) Shape-2 answers 3033/4683 at 0.6, 3023/4663 at 0.6000000008, 3022/4661 at the port's own 0.60000000080011395 (stable over three runs), 3027/4671 at 0.6000000009 and 3033/4683 at 0.5999999999 - so it is the most deflection-sensitive model in the set, not the invariant one, and 0.6000000008 is itself a rounded argument that lands on a different answer. The port's 3037/4691 is its own answer at its own lin, so the +15/+30 stands for a same-deflection comparison, but eleven nodes out of 4691 sit inside the model's own deflection noise and this residual cannot be read as a clean port defect until the knife edge behind it is understood. The eleven rows are two mirror families whose residuals are equal and opposite around a shared total (100/153 against 102/157 and 102/157 against 104/161) plus the pair face 15/16 (port 276/497 against 270/485) and faces 26/27 (port 255/439 against probe 253/435, port 258/445 against 255/439). No port file outside the three allowed_files was touched."
