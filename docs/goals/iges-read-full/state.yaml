      summary: "THE C0 TO C1 B-SPLINE SPLIT LANDED AND CLEARED BOTH OPEN NON-ORACLE MODELS. (1) shape_upgrade/c0_bspline_sequence.rs ports ShapeUpgrade.cxx:40-130 and :174-194: walk the internal knots, take the first whose multiplicity is >= the curve degree, slice at that knot, clamp the two resulting curves' end multiplicities to degree + 1, and recurse on both halves until no such knot is left; poles and weights are copied through BSplCLib::FlatIndex, and knot values are copied exactly (no re-normalisation). Two entry points, c0_bspline_to_sequence_of_c1_bspline_curve and c0_bspline2d_to_sequence_of_c1_bspline_curve, returning None when the curve is already C1 or is not a B-spline. (2) Wired exactly where the cxx calls it and nowhere else: iges_to_brep_topo_curve.rs:102 inside transfer_topo_basic_curve behind 'cxx:1021-1022' (ShapeAlgo AlgoContainer call) with the caller's CONTINUITY >= 1 test, and :1278 inside the 2D pcurve arm behind 'cxx:1238'. The fallback path is untouched: when the split returns None the old single-edge branch 'cxx:1039-1053' / 'cxx:1257-1274' still runs. (3) The two models that were open in T032 now match the live probe face for face: screw went 9/10 to 10/10 with model totals 500/597 = 500/597 (was port 499/596), and Shape-1 went from one differing Bezier face to 60/60 with totals 3055/3758 = 3055/3758. So the whole residual T029/T031/T032 attributed to a boundary/grain or pcurve-parity effect on those two models is retired: the missing arm was the C0 splitter. (4) Current paired state, both sides at the port's own resolved deflection: 12 of 14 models exact face for face and node/triangle for node/triangle - Cube 24/12, Cylinder 164/158 (3/3), Extrusion 24/12, HoledPlate 180/128 (32/32), Offset 672/812 (26/26), OffsetPlaneHoleEdge 40/24 (9/9), rev 104/92 (6/6), screw 500/597 (10/10), Shape-1 3055/3758 (60/60), Shape 7191/13433 (11/11), Sphere 1725/3410 (1/1), Torus 302/146 (1/1). (5) INSTRUMENT CORRECTION, and it is what makes the two rem