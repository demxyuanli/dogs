ss 6 with max_lin=0.039277 < 0.040000 and max_sq_defl=9.98e-4. NURBSGRID: 22 raw U params, 18 a sub-epsilon cluster (3.9e-17 .. 7.0e-16) plus 3 duplicates of 6.283185306999996; the U grain collapses to {0, 2pi} and the AnalyticalFilter bisection yields a uniform 33-grid whose odd entries are removed (u_rm=16) leaving 17 (NURBSRangeSplitter.cxx:315-360, AnalyticalFilter :28-215). Next: compare the AnalyticalFilter kept-count and the 323->255 classifier drop against OCCT. MakeApprox stays on one 3D subspace (AdvApp2Var_Iso.cxx:122). No new OBJ export. ADDENDUM: gp_Mat::SetRotation now matches gp_Mat.cxx:122-158 op-for-op (precomputed A*A/B*B/C*C/AB/AC/BC, diagonal 1+aOmCos*(-(B2+C2))), which restored the sphere DC trace from a 536 pass-2 regression back to the recorded 880/437/36/16/4 -> 1666/3292; ElSLib::SphereD0 also now sums A1*X+A2*Y+A3*Z then adds PLoc (ElSLib.cxx:623-625). Remaining sphere gap localised to ONE place: OCCT pass-2 ctrl=496 vs port 437 (59 points), and 1725-1666=59, so all of it is pass 2. Traced upstream: the pre-DC structure disagrees on 122/546 diagonals (grid triangles), which comes from ~1 ulp (max 5.33e-15) differences in 180/293 pre-DC node UV coords (30 boundary ids<=41 + 150 grid ids>41), which flip the cocircular (rectangular UV cell) diagonal choice in crates/occt-topo/src/meshing/delaun/triangulation.rs (BRepMesh_Delaun::createTriangles). Next: line up that triangulator against BRepMesh_Delaun.cxx:412-720. ROUND 2: the triangulator itself is now EXONERATED - replaying BRepMesh_Delaun::AddVertices step by step over all 255 insertions (delaun_steps_port_f0.txt vs delaun_steps_occt_f0.txt) gives 0 mismatches, so createTrianglesOnNewVertices/createTriangles/STL heap sort/cavity deletion are bit-identical given identical input; the 122/546 diagonal flips are strictly an input-coordinate effect. The V deltas are not ULP noise of one evaluation: they are 0 ulp at the start of each boundary chain and grow to -2..-5 ulp toward its far end (180/