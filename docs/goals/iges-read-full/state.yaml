      summary: "CORRECTION APPENDED 2026-10-12 (review of comparison rigour, read this first): the Torus number in this receipt (319/184 -> 4096/7938) is NOT reproducible and is withdrawn. Re-measured with a forced rebuild and byte-identical hashes over 4 runs each of Cylinder/Shape-2/rev, the same call now leaves Torus with an EMPTY mesh: with the cxx:964 call the Torus read prints 'FACES n=1 lin=0.096000' and 'v=0 f=0' (the example exits 1 on nv==0), and with only that call reverted it prints mv=319 mt=184 / v=319 f=184. OCCT's own --facestats 0.096 0.349066 on the same file is face 0 nodes=302 triangles=146, so BOTH port states are wrong and the faithful call makes the port's Torus worse in observable terms (no triangulation at all). The earlier 4096 reading came from a build whose source I cannot reconstruct; per-run determinism holds within a build, so it was a build/source state, not run noise. The probe side of the earlier claim (OCCT --igespc EDGE[4] REV pcrange=[3.14159,9.42478] p1=(0,3.14159) p2=(0,9.42478)) still holds and the port's post-fix dump still matches it edge for edge, so the healing structure is right and the failure is downstream in the mesher's face-domain handling. Also from the same review: the 14-model sweep quoted in this receipt is a TOTALS-ONLY comparison, which cannot see a permutation; a clean per-face comparison at the deflection the port actually prints (port FSTAT face= mv/mt vs occt_probe --facestats <same lin> 0.3490658503988659) matches per face only for Cone, Cube, Cylinder, Extrusion, HoledPlate, OffsetPlaneHoleEdge and Sphere, and differs for Offset (totals equal 672/812 but the 20/18 and 51/73 faces sit at different indices), rev (totals equal 104/92, the 24/22, 28/26 and 20/18 faces permuted), screw (502/602 vs 500/597), Shape-2 (3029/4675 vs 3033/4683), Shape (7191/13433 vs 7192/13435), Shape-1 (6498/10644 vs 3053/3754) and Torus (0/0 vs 302/146). The absolute FSTAT sums recorded in T013/T014/T015/T016 for Cylinder (279/307, 271/287), screw (705/892, 706/893), Shape (2798/4560, 2799/4562), Shape-1 (6074/9757) and Torus (1519/2882, 1642/3122) do NOT reproduce today at the lin the port prints (today: Cylinder 164/158, screw 502/602, Shape 7191/13433, Shape-1 6498/10644, Torus 0/0), so those receipts' absolute numbers and any per-model 'toward OCCT' reading built on them must be re-measured before they are used again; OCCT Cylinder at the port's own 0.04 is 164/158 and no OCCT deflection tried (0.04 164/158, 0.02 152/146, 0.01 182/176) reproduces the recorded 271/287. Finally, 'deflection 0.1' in this goal's text is a misnomer: brep_to_obj's argument is the drawer MaximalChordialDeviation and only matters for a void/unbounded box, the real linear deflection is Prs3d::GetDeflection = maxComp(bbox)*0.001*4 (brep_exchange.rs:56-77, occt Prs3d::GetDeflection), which is 0.004*10 = 0.04 for the Cylinder; the probe must be given that number, not 0.1. FixAddNaturalBound measured each wire's UV box with the wrong function, and on Torus.iges face 0 that flipped the cxx branch. ShapeFix_Face.cxx:962-964 builds aWireFace = TopoDS::Face(myFace.EmptyCopied()), adds the wire and calls ShapeAnalysis::GetFaceUVBounds(aWireFace, Umin, Umax, Vmin, Vmax) = ShapeAnalysis.cxx:268-299: a face with no edge answers BRep_Tool::Surface(F, L)->Bounds (cxx:277-281), otherwise every edge's pcurve from ShapeAnalysis_Edge::PCurve(edge, F, c2d, f, l, false) is accumulated through ShapeAnalysis_Curve::FillBndBox(c2d, f, l, 20, true, B) (cxx:296; 20 samples plus the X/Y extrema search of ShapeAnalysis_Curve.cxx:788-848) and read back with Bnd_Box2d::Get (cxx:298). The port called brep_surface::face_uv_bounds, i.e. the BRepTools::UVBounds shape (BRepTools.cxx:64-75, :126-160), which also folds in the 3D curve and the vertices. Torus.iges face 0 is a Geom_SurfaceOfRevolution with u and v both closed and SUL-SUF = SVL-SVF = 2*pi, and there the two boxes differ in the last bits: BRepTools gave u[-1.79595575382632442e-10, 6.28318530717958890] (2.7e-15 ABOVE SUL), GetFaceUVBounds-style sampling gives u[-1.79594243115002892e-10, 6.28318530717958623] (SUL exactly). CutInterval (cxx:808-850) reads the sign of that residue: with Umax above SUL, the j=0 pass shifts toAdd to Umax-2*pi, the test `toAdd.Y() <= interval.X()` is true and the pass skips, then the j=1 pass takes the first branch and writes interval = [0, 6.2831853069999998], so intU is non-empty and FindBestInterval (cxx:853-864) returns pi -> shift.x = pi -> the natural bound is Shift2dWire'd (cxx:1020-1024) to u in [pi, 3pi]. With Umax <= SUL the j=0 pass trims the interval to [6.283185307, 2*pi] and the j=1 pass hits the final `else intervals.Remove(i--)` (cxx:843-846), so intU is empty and FindBestInterval leaves shift = (0, 0) -> the natural bound stays on the surface's own range. OCCT's own state is the shift-0 one: probe --igespc on Torus.iges prints FACE[0] surf=Geom_SurfaceOfRevolution u=[0,6.28319] v=[3.14159,9.42478] with EDGE[4] REV pcrange=[3.14159,9.42478] p1=(0,3.14159) p2=(0,9.42478), and the port after the fix prints EDGE[4] REV p1=(0.000000,3.141593) p2=(0.000000,9.424778) with the same pcrange, while before the fix that bound sat at u in [pi, 3pi] (p1=(3.141593,3.141593) p2=(3.141593,9.424778)). New shape_fix_compose_shell::get_face_uv_bounds implements ShapeAnalysis.cxx:268-299 on the existing fill_bnd_box (itself a port of ShapeAnalysis_Curve.cxx:788-848) and is used at the cxx:962 site, so the two call sites now share one OCCT function. A/B measured with only that call reverted: all 13 other oracle totals are bit-identical (Cone 863/1644, Cube 24/12, Cylinder 164/158, Extrusion 24/12, HoledPlate 180/128, Offset 672/812, OffsetPlaneHoleEdge 40/24, Shape-1 6498/10644, Shape-2 3029/4675, Shape 7191/13433, Sphere 1725/3410, rev 104/92, screw 502/602) and only Torus moves, 319/184 -> 4096/7938. Side finding, reported and not fixed: with the port's face now structurally OCCT's (two wires of four edges, original wire u[0,2pi] x v[-pi,pi], natural bound u[0,2pi] x v[pi,3pi], matching the --igespc dump edge for edge), the meshes still disagree - OCCT --facestats 0.096 0.349066 gives face 0 nodes=302 triangles=146 over the full torus bbox while the port gives 4096/7938 at its own lin=0.096000, so the remaining gap is the mesher's domain handling for a closed face whose two wire rectangles coincide modulo the v period, not ShapeFix. The temporary SFFNATDBG blocks used for the A/B were removed again. No OBJ was exported into data/output/iges-occ, iges-read or iges-read-fixshape, full_outcome_complete was not set and graphify label was not run."
      evidence: "REVIEW 2026-10-12 (reproducible measurements only; supersedes the historical lines at the end of this field, including the Torus 4096/7938 reading, which is not reproducible and is withdrawn): forced rebuild then exe run, Torus.iges with the cxx:964 call = 'FACES n=1 lin=0.096000 ang=0.349066' + 'v=0 f=0 exact=[-12,-12,-2]~[12,12,2]' (exit 1), with only that call reverted = 'FSTAT face=0 key=2154531385920 mv=319 mt=184' + 'v=319 f=184'; OCCT occt_probe _igesdump/oracle/Torus.iges --facestats 0.096 0.3490658503988659 = 'FSTAT_OCC face=0 nodes=302 triangles=146 bbox=(-12,-12,-2)-(12,12,2)'; per-run determinism: 4 runs each of Cylinder/Shape-2/rev give one md5 per model (Cylinder BF9FE5A2709EA75B2CB324A39794AC02 f=158, Shape-2 985A3AA04F1ED292613E0434C5DB1A02 f=4675, rev F800B5E78827BD3598A9818D835DBC6A f=92), 6 Torus runs identical (0/0); per-face sweep at the port's own printed lin, Port FSTAT face= mv/mt vs occt_probe --facestats <lin> 0.3490658503988659 FSTAT_OCC face= nodes/triangles: Cone MATCH (827/1610 + 36/34), Cube MATCH (6x 4/2), Cylinder MATCH (92/90, 36/34, 36/34), Extrusion MATCH (6x 4/2), HoledPlate MATCH (30/34, 30/34, 30x 4/2), OffsetPlaneHoleEdge MATCH (8/8 + 8x 4/2), Sphere MATCH (1725/3410), Offset DIFF at f1/f3/f7/f8/f9/f10/f12/f14/f17/f18/f19/f20/f21/f22/f23/f25 with totals equal 672/812 on both sides, rev DIFF at f0/f1/f3 with totals equal 104/92, screw DIFF with totals 502/602 vs 500/597, Shape-2 DIFF with totals 3029/4675 vs 3033/4683, Shape DIFF with totals 7191/13433 vs 7192/13435, Shape-1 DIFF on 48 of 60 faces with totals 6498/10644 vs 3053/3754, Torus DIFF 0/0 vs 302/146; OCCT Cylinder deflection scan = 0.04 164/158, 0.02 152/146, 0.01 182/176, none of which is the 271/287 recorded earlier; HISTORICAL (not reproduced): cargo check --manifest-path crates/occt-topo/Cargo.toml --offline = 0 errors; cargo test --manifest-path crates/occt-topo/Cargo.toml --lib --offline = 1281 passed; cargo test --manifest-path crates/occt-topo/Cargo.toml --offline --test step_obj_gates = 4 passed (with the new call in place); A/B sweep via iges_read_obj --fstats with the cxx:964 call reverted = Cone 863/1644, Cube 24/12, Cylinder 164/158, Extrusion 24/12, HoledPlate 180/128, Offset 672/812, OffsetPlaneHoleEdge 40/24, Shape-1 6498/10644, Shape-2 3029/4675, Shape 7191/13433, Sphere 1725/3410, Torus 319/184, rev 104/92, screw 502/602; with the new call = the same 13 plus Torus 4096/7938; zz_pcface_dump _igesdump/oracle/Torus.iges with the new call = 'SFFNAT wire=0 uv=u[-1.79594243115002892e-10,6.28318530717958623e0] v[3.14159265382041042e0,9.42477796117958633e0]', 'SFFNAT shift=(0.000000000000,0.000000000000) surf=u[0.000000000000,6.283185307180] v[3.141592653590,9.424777960769] int_u= int_v= centers=[3.141592653500,6.283185307500]', 'FACE[0] FWD surf=Geom_SurfaceOfRevolution u=[0.000000,6.283185] v=[3.141593,9.424778] uclosed=1 vclosed=1', 'EDGE[4] REV c3=Geom_Circle c3r=[3.141593,9.424778] pc=Geom2d_Line pcr=[3.141593,9.424778] p1=(0.000000,3.141593) p2=(0.000000,9.424778)'; reverted = 'SFFNAT wire=0 uv=u[-1.79595575382632442e-10,6.28318530717958890e0]', 'SFFNAT shift=(3.141592653500,0.000000000000) int_u=[0.000000000000,6.283185307000]', 'EDGE[4] REV p1=(3.141593,3.141593) p2=(3.141593,9.424778)'; OCCT ground truth: probe --igespc Torus.iges = 'FACE[0] FWD surf=Geom_SurfaceOfRevolution u=[0,6.28319] v=[3.14159,9.42478] uclosed=1 vclosed=1', 'EDGE[0] FWD c3=Geom_BSplineCurve pc=Geom2d_Line pcrange=[0,6.28319] null3d=0 erange=[0,6.28319] p1=(6.28319,-3.14159) p2=(-3.55271e-15,-3.14159)', 'EDGE[1] ... PREC q1=(-1.7959145282020472e-10,-3.1415926531795884) q2=(-1.7959424311500289e-10,3.1415926538204118)', 'EDGE[2] ... p2=(6.28319,3.14159)', 'EDGE[4] REV c3=Geom_TrimmedCurve pc=Geom2d_Line pcrange=[3.14159,9.42478] null3d=0 erange=[3.14159,9.42478] p1=(0,3.14159) p2=(0,9.42478)'; probe --facestats 0.096 0.3490658503988659 Torus.iges = 'FSTAT_OCC defl=0.096 angle=0.349066 faces=1', 'FSTAT_OCC face=0 nodes=302 triangles=146 bbox=(-12.000000,-12.000000,-2.000000)-(12.000000,12.000000,2.000000)'; probe --structdump 0 = 'OCCTSTRUCT f=0 type=7 wires=2', 'W 0 edges=4', 'W 1 edges=4'; OCCT sources read: ShapeFix_Face.cxx:808-864 :876-1108 (CutInterval 808-850, FindBestInterval 853-864, GetFaceUVBounds call 964, CutInterval calls 969/973, FindBestInterval calls 982/986, wire shift 989-1003, natural bound 1005-1027); ShapeAnalysis.cxx:268-299; BRepTools.cxx:64-75 :126-160"
