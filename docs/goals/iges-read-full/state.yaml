      summary: "Two annotations were wrong and one arm was running against its own gate. (1) FixSeam is NOT reached: the gate is isReady && NeedFix(myFixSeamMode, false), and NeedFix(Flag, need) is Flag < 0 ? need : Flag > 0 (ShapeFix_Root.lxx:100-104), so the false argument is exactly what the default -1 resolves to. myFixSeamMode is -1 (ShapeFix_Wire.cxx:182), the IGES operator leaves it at -1 (IGESData.cxx:150, DE_ShapeFixParameters.hxx:73 FixOrNot, XSAlgo_ShapeProcessor.cxx:679) and ShapeProcess_OperLibrary.cxx:856 passes it through, so the arm and its DONE6 / FAIL6 bits are dead on both read paths. The same rule makes FixRemovePCurve (cxx:637, IGESData.cxx:146) and FixRemoveCurve3d (cxx:866, IGESData.cxx:147) unreachable; neither is ported, which is right. The comment in wire_fix/notched.rs said NeedFix was true - corrected to the default-off reading. (2) FixTails: the IGES DE default is FixMode::FixOrNot = -1 (DEIGES_Parameters.cxx:69), so the cxx:414 test myFixTailMode != 0 passes and OCCT DOES call FixTails, but its first statement returns false because myMaxTailWidth is ctx->RealVal(\"MaxTailWidth\", -1) (ShapeProcess_OperLibrary.cxx:861) from DE_ShapeFixParameters.hxx:79 FixOrNot = -1. STEP's DE default is NotFix = 0 (DESTEP_Parameters.cxx:92-95), so STEP does not even call. Absent either way, so not porting FixTails is faithful - the comment now carries the MaxTailWidth reason instead of the wrong FixTailMode = 0 claim. (3) The real finding: ShapeFix_Wire::FixSameParameterMode comes from the key FixEdgeSameParameterMode (ShapeProcess_OperLibrary.cxx:857), a different key from ShapeFix_Shape's FixSameParameterMode (:813). The scope ShapeProcess sets (ShapeProcess.cxx:214) makes the lookup FixShape.FixEdgeSameParameterMode (ShapeProcess_Context.cxx:192-208 :223), and that key is 0 on both read paths: DE_ShapeFixParameters.hxx:75 FixEdgeSameParameterMode = FixMode::NotFix (hxx:27), DEIGES_Parameters.cxx:64-72 and DESTEP_Parameters.cxx:92-95 both return that struct with the field untouched, XSAlgo_ShapeProcessor.cxx:681 writes it, and the legacy map agrees (IGESData.cxx:152, STEPControl_Controller.cxx:247). NeedFix(0) is false, so OCCT-IGES/DESTEP does NOT run the cxx:953-1005 arm: neither its CheckPCurveRange re-projection (cxx:958-993, RemovePCurve + FixAddPCurve re-projection) nor its FixSameParameter(Edge, Face()) (cxx:995). The port ran both in perform_wire_first_round and check_pcurves_and_shift. Both are now behind FIXEDGE_SAMEPARAM_ARM in wire_fix/notched.rs, set to false. The same work is done in OCCT by the separate key FixSameParameterMode (OperLibrary.cxx:813, DE default -1 -> NeedFix true) at ShapeFix_Shape.cxx:259. A/B measured, not assumed: arm ON and arm OFF give byte-identical mesh totals on all 14 oracle models - Cone 863/1644, Cube 24/12, Cylinder 271/287, Extrusion 24/12, HoledPlate 180/128, Offset 672/812, OffsetPlaneHoleEdge 40/24, rev 104/92, screw 705/892, Shape-1 6074/9757, Shape-2 3029/4675, Shape 2798/4560, Sphere 1725/3410, Torus 1642/3122 - and with the arm off the lib suite stays 1281 passed and step_obj_gates stays 4 passed. The arm was redundant on this corpus, so removing it follows the cxx at no cost. (4) Still unported, reported not fixed: iges_process_shape.rs calls same_parameter_shape (BRepLib::SameParameter, BRepLib.cxx:1251-1739) where ShapeFix_Shape.cxx:259 calls ShapeFix::SameParameter (ShapeFix.cxx:70-258) - per-edge FixSameParameter over the ancestor faces from TopExp::MapShapesAndAncestors with the enforce=false arm and the failure clean-up (cxx:135-164), plus the planar second stage the port has no equivalent for (23 samples, 1.00005*sqrt(tol2) writes on the edge and both vertices, cxx:232-257). Queued as the next worker package. No new OBJ was exported into data/output/iges-occ, iges-read or iges-read-fixshape, full_outcome_complete was not set and graphify label was not run."
