  - id: T029
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Localise the remaining Shape-1 residual (port 3039/3726 against the probe 3053/3754) to a named missing OCCT control-flow arm, or record it as an unported gap that cannot be closed without a heuristic."
    inputs:
      - "crates/occt-topo/src/meshing/range_splitter/param_set.rs (compute_grain_and_filter, the port of computeGrainAndFilterParameters)"
