      - "src/ModelingAlgorithms/TKMesh/BRepMesh/BRepMesh_NURBSRangeSplitter.cxx:540-640 (computeGrainAndFilterParameters, filterParameters)"
      - "src/ModelingAlgorithms/TKMesh/BRepMesh/BRepMesh_BoundaryParamsRangeSplitter.hxx:33-38 :42"
      - "specs/occt_probe/run_probe_iges.bat _igesdump/oracle/Shape-1.iges --facestats 0.308 0.3490658503988659"
    constraints:
      - "Port the missing cxx arm as written; no predicate, area ratio, length filter or MinSize clamp that OCCT does not have."
      - "A model that already matched must stay matched; a movement that leaves the probe is reverted."
      - "Do not re-export into data/output/iges-occ, iges-read or iges-read-fixshape."
    verify:
      - "cargo check --manifest-path crates/occt-topo/Cargo.toml --offline --all-targets"
      - "specs/occt_probe/run_probe_iges.bat _igesdump/oracle/Shape-1.iges --facestats 0.308 0.3490658503988659"
      - "14-model IGES sweep with iges_read_obj --fstats, FSTAT mv/mt summed"
    stop_if:
      - "The divergence is reproducible only as a heuristic (no cxx arm exists); then report it as unported instead of patching."
    expected_output:
      - "The named cxx arm for the Shape-1 residual, or a statement that no arm is missing with the evidence for it."
    receipt:
      summary: "NO CXX ARM IS MISSING; THE RESIDUAL IS LAST-BIT PARITY OF THE PCURVE-DERIVED BOUNDARY V PARAMETERS. (1) Shape-1's -14 nodes / -28 triangles is exactly five faces: four Geom_SurfaceOfRevolution faces whose interior grid is 2x5 here against OCCT's 2x7 (-4 nodes / -8 triangles each, port face 2 = 36/44 against the probe's reverse-sorted face 1 = 40/52) and one Bezier/BSpline face at +2 nodes / +4 triangles (portfolio face 30 = 218/227 against 216/223). (2) On those revolution faces the BoundaryParamsRangeSplitter::AddPoint source V parameters (hxx:33-38) are 26 values that collapse to 19 after the min-distance pre-filter (NURBSRangeSplitter.cxx:594-605), and the 19 are exactly two interleaved arithmetic families over the face's 90 degree V range: -90,-80,...,0 (10 degree steps, even indices) and -81,-72,...,-9 (9 degree steps, odd indices). (3) The grain distance is aDiff = min(0.1*range, max(0.005*range, 2*VResolution)) = 0.1 * 1.5707963269999986 = 0.15707963269999986 (cxx:558-565), i.e. the 9 degree step itself, so every is-this-sample-more-than-aDiff-from-the-last test at cxx:616 lands within 5e-16 of equality. (4) Replaying cxx:596-640 op for op on the port's own printed pre-filtered array and aDiff reproduces the port's 13-value output bit for bit, including the candidate-promotion arm; the decisive tests are +5.00e-16 (fires), -3.89e-16 (does NOT fire, and this is the comparison that drops the -80 degree member), +5.55e-17 (fires, 2 ulp), -1.67e-16, -5.55e-17, and three at +7.2e-10 / +2.8e-10 / +1.4e-1. (5) So which of the two families survives is decided by last-bit differences in the pcurve-derived boundary V parameters - the same class of ~1e-10 inverse-evaluation perturbation the T008 Sphere entry recorded - and not by a rule. No filter arm, no read arm and no classifier arm is missing, and the port gates forbid masking it with a per-model rule. (6) The probe side was re-measured at the exact Prs3d angle: Shape-1 answers 3053/3754 at 0.3490658503988659 and 3007/3670 at 0.349066, so the T026 figure 3021/3698 was a mis-measurement and is withdrawn. (7) The 14-model sweep after T028, at each model's own printed lin: Cube 24/12, Sphere 1725/3410, Cone 863/1644, Cylinder 164/158, Extrusion 24/12, HoledPlate 180/128, Offset 672/812, OffsetPlaneHoleEdge 40/24, rev 104/92, Torus 302/146 (ten exact), screw 499/596, Shape-1 3039/3726, Shape-2 3037/4691, Shape 7191/13433 against the probe's screw 500/597, Shape-1 3053/3754, Shape-2 3033/4683, Shape 7192/13435."
      evidence: "Per-face multiset on Shape-1 at 0.308 and 0.3490658503988659: the probe's sorted rows include 33/39 x12, 40/52 x4, 52/52 x2, 56/78 x6, 57/79 x2, 72/72, 76/74, 165/218, 179/186, 184/182, 216/223, 236/297, 429/762 against the port's 33/39 x12, 36/44 x4, 52/52 x2, 56/78 x6, 57/79 x2, 72/72, 76/74, 165/218, 179/186, 184/182, 218/227, 236/297, 429/762. Source read: BRepMesh_NURBSRangeSplitter.cxx:540-565 (aDiffMinLim = max(0.005 * theRangeDiff, 2 * theTol2d); aDiff = min(0.1 * theRangeDiff, aDiffMinLim)) and :596-640 (the filter loop), BRepMesh_BoundaryParamsRangeSplitter.hxx:33-38 (AddPoint writes both GetParametersU and GetParametersV) and :42. FDISTDBG replayed the pre-filtered 19-value V array and aDiff on the port's own numbers; the filter trace's decisive comparisons are the six listed above. Probe angle sensitivity, two runs per value: angle=0.349066 nodes=3007 tris=3670 both runs, angle=0.3490658503988659 nodes=3053 tris=3754 both runs. This task was executed in the session before the T030 verification and its receipt was missing from this file; it is recorded here from that session's notes and was re-confirmed end to end by T030's clean rebuild (all fourteen numbers reproduce)."
      artifacts:
        - "docs/goals/iges-read-full/state.yaml"
      checks:
        - name: shape_1_residual_localised_to_five_faces
          status: pass
        - name: filter_parameters_replayed_bit_for_bit_on_port_array
          status: pass
        - name: no_missing_cxx_arm_reported_instead_of_patched
          status: pass
        - name: fourteen_model_sweep_recorded
          status: pass
    receipt_note: "Open. The four non-matching models are mesh density inside faces at OCCT's own face count, not a read gap. Closing Shape-1 would need the pcurve-derived boundary V parameters themselves to agree bit for bit, which is a shared-projection problem, not a filter or read arm."

