nError(\"BSpline curve: # Poles and degree mismatch\"); }'; BSplCLib.cxx:392-451 'int BSplCLib::NbPoles(const int Degree, const bool Periodic, const NCollection_Array1<int>& Mults) { ... else { const int Deg1 = Degree + 1; if (Mf > Deg1) return 0; if (Ml > Deg1) return 0; sigma = Mf + Ml - Deg1; } for (int i = 1; i < l - f; i++) { if (pmu[i] <= 0) return 0; if (pmu[i] > Degree) return 0; sigma += pmu[i]; } return sigma; }' -> degree 3, mults (3, 3): sigma = 3 + 3 - 4 = 2 poles, legal. BSplCLib.cxx:1555-1610 'BuildKnots' reads 'pkn[j]' with 'int j = Index - 2;' for Degree 3, i.e. no wrap; BSplCLib.cxx:321-364 'LocateParameter' and BSplCLib.cxx:344-347 'first = Knots.Lower() + Degree; last = Knots.Upper() - Degree;' are the clamp that keeps it in range. PoleIndex: BSplCLib.cxx:1758-1779 'int BSplCLib::PoleIndex(...) { for (i = Mults.Lower(); i <= Index; i++) { pindex += Mults(i); } ... else { pindex -= Degree + 1; } return pindex; }'. Port side, the wrapping branch already present: crates/occt-core/src/bspl/curve_eval.rs:63-71 and :74-80. Diff scope: crates/occt-core/src/bspl/eval.rs only, both eval_curve (pole window + signed clamped k0/k1) and eval_curve_rational (same). Post-edit verification, all with CARGO_TARGET_DIR=_tmp/tgt_t022b from the post-edit snapshot: 'cargo test --manifest-path crates/occt-core/Cargo.toml --offline --lib' = 'test result: ok. 290 passed; 0 failed; 1 ignored; 0 measured; 0 filtered out; finished in 0.02s' with 'test bspl::eval::tests::eval_linear ... ok' and 'test bspl::eval::tests::eval_cubic_endpoints ... ok'; 'cargo test --manifest-path crates/occt-topo/Cargo.toml --offline --test step_obj_gates' = 'test cylinder_step_mesh_covers_full_u_period ... ok', 'test step_obj_parity_bboxes_match_occt ... ok', 'test step_to_obj_exports_valid_obj ... ok', 'test step_obj_area_matches_occt ... ok', 'test result: ok. 4 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 235.01s'. 14-model sweep post-edit, same private target, 'iges_