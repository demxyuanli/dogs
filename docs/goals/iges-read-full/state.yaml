      evidence: "Cube: port 12 tris, occ 12, no counterpart at 1e-5 = 0, worst matched distance 0. Extrusion: 12/12, worst 0. HoledPlate: 128/128, worst 1.7663527398481e-06; port OBJ '_t_HoledPlate.obj' v=180 outside-slab=0 bbox=(0,0,0)~(100,80,5), data/output/iges-occ/HoledPlate.obj v=180 outside-slab=0 bbox=(0,0,0)~(100,80,5). rev: 92/92, worst 8.0769424889946e-07. Sphere: port 3410, occ 3410, no counterpart = 18, worst matched 9.03841800002693e-07. Cone: port 1644, occ 1642, no counterpart = 25, worst matched 1.09040405308964e-06. Offset: port 812, occ 812, no counterpart = 30, worst matched 1.17076983219552e-06. Same run with candidate reuse allowed (no exclusive assignment) gives the same 18 / 25 / 30. Per-face counts by index at the port's own lin (port FSTAT face= mv/mt vs occt_probe --facestats <lin> 0.3490658503988659 FSTAT_OCC face= nodes/triangles): Cone MATCH 827/1610 + 36/34; Cube MATCH 6x 4/2; Cylinder MATCH 92/90 + 36/34 + 36/34 (OCCT face 0 bbox (-2,-2,0)-(2,2,10) = the lateral face, the port's FACE i=0 is type=Rev u=[0,6.283185] v=[0,10]); Extrusion MATCH 6x 4/2; HoledPlate MATCH 30/34 + 30/34 + 30x 4/2; OffsetPlaneHoleEdge MATCH 8/8 + 8x 4/2; Sphere MATCH 1725/3410; Offset DIFF at f1/f3/f7/f8/f9/f10/f12/f14/f17/f18/f19/f20/f21/f22/f23/f25 with totals equal 672/812 both sides; rev DIFF at f0/f1/f3 with totals equal 104/92 both sides; screw DIFF totals 502/602 vs 500/597; Shape-2 DIFF totals 3029/4675 vs 3033/4683; Shape DIFF totals 7191/13433 vs 7192/13435; Shape-1 DIFF on 48 of 60 faces totals 6498/10644 vs 3053/3754; Torus DIFF 0/0 vs 302/146; OCCT face boxes that differ from the port's mesh boxes on HoledPlate: OCCT 57.237317,36.784813,-0.153719,58.153719,40.153719,5.153719 and 69.928193,31.999989,-1.071807,80.071807,34.143604,6.071807 vs port 57.391036,36.938533,0.000000,58.000000,40.000000,5.000000 and 71.000000,33.071797,0.000000,79.000000,33.071797,5.000000, each 4 nodes on both sides; the visible port shape bbox printed by the example is exact=[-1.0718075027677614,-1.0718075027677614,-1.0718075027677614]~[101.07180750276777,81.07180750276777,6.071807502767761], i.e. the topology box, while its mesh stays in the slab"
