      summary: "THREE RESULTS. (1) OPEN ITEM (c) IS AN INSTRUMENT ARTEFACT AND THE MISSING PIECE IS NAMED: BRepLib::ReverseSortFaces. occt_probe --facestats takes its per-face node/triangle counts from BRepMesh_ModelBuilder's IMeshData_Model (occt_probe.cpp:1602-1633, 'aModel->GetFace(f)'), and that array is filled by IMeshTools_ShapeExplorer::Accept from an NCollection_List built by BRepLib::ReverseSortFaces(theShape, aFaceList) (IMeshTools_ShapeExplorer.cxx:74-85), not by a TopExp_Explorer walk. ReverseSortFaces buckets every face by GeomAdaptor_Surface::GetType and appends the buckets as LTri, LOther, LTor, LSphere, LCon, LCyl, LPlan (BRepLib.cxx:2955-3009), so planes come last, while --wireinv (occt_probe.cpp:1651) and the port both enumerate in TopExp_Explorer order. rev.iges: the port's FACE list is Plane(4 edges), Rev(4), Plane(4), Rev(4), Plane(4), Plane(4) and OCCT --wireinv answers f=0 type=0 wires=1 edges=4 through f=5 with exactly that type/wire/edge sequence, face for face; the port's per-face counts in explorer order are Plane 24/22, Rev 28/26, Plane 24/22, Rev 20/18, Plane 4/2, Plane 4/2, and the bucket order (LTri empty, LOther = Rev in explorer order, then plane) reproduces OCCT's printed sequence 'FSTAT_OCC face=0 nodes=28 triangles=26 bbox=(-0.000000,-0.000000,-0.000000)-(10.000000,10.000000,10.000000)' ... 'face=5 nodes=4 triangles=2 bbox=(-0.000000,5.000000,-0.000000)-(0.000000,10.000000,10.000000)' row for row, bboxes included. Offset.iges the same at 26/26 faces: --wireinv gives Rev/Plane in the port's explorer order (f=0 Rev 4 edges, f=1 Plane 4, f=2 Rev 4, f=3 Plane 4, ... f=25 Rev 3) and the same bucket order turns the port's 20 Rev rows plus 6 Plane rows into OCCT's 12x 20/18 + 8x 51/73 + 6x 4/2. Three consecutive probe runs are byte-identical, so the mesher order is a deterministic sort, not parallel scheduling. No port change was needed for item (c): the port's face enumeration already equals OCCT's TopExp_Explorer order, and the recorded 'different index order' was the mesher's own face array. (2) THE 402 FORM 9 ARM IS PORTED ARM FOR ARM. Model: EntityData::SingleParent { parent, children } plus parse_single_parent (parent count read and dropped, child count, the single parent, then the children only when the count is positive, a null pointer kept as None) with the (402, 9) dispatch of IGESBasic_ReadWriteModule::CaseIGES = 14 (cxx:60-72) and pointer_targets carrying both the parent and the children (IGESBasic_ToolSingleParent.cxx:42-105). Predicate: is_topo_surface(model, index) now takes the entity and adds the SingleParent arm (IGESToBRep.cxx:291-309: the parent must be a 108 and every child a 108), with is_curve_and_surface, actor_recognize, transfer_geometry and the brep_entity / bounded_surface / curve_on_surface / offset_surface call sites updated to pass it; a null parent is false here, which OCCT reaches by dereferencing without a test at cxx:297 and which no consumer accepts (IGESToBRep_TopoSurface.cxx:1543-1551). Transfer: transfer_plane_parts was split out of transfer_plane so the same function can answer first=true (face plus external contour) and first=false (contour only), and transfer_perforate follows TransferPerforate (cxx:1526-1604) - the parent plane gives the face and its external contour, every child plane a hole wire added to that face, a child that is not a 108 skipped (IGES_1285), a child whose transfer is not a wire skipped (IGES_1156), the child's own local transformation composed onto the hole wire (cxx:1589-1593) and the global transformation applied last (cxx:1597-1603) - reached from the transfer_topo_surface 402 arm (cxx:245-249). The 402 entity class stays a BRepEntity exception exactly as before (IGESToBRep_BRepEntity.cxx:480-485). (3) THE 14-MODEL SWEEP WAS RE-MEASURED AGAINST THE LIVE PROBE AND FOUR MODELS DO NOT AGREE - a correction to the T020 / T021 closure text. Ten models reproduce 'run_probe_iges.bat <model>.iges --facestats <the port's own printed lin> 0.3