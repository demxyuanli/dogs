    verify:
      - "cargo check --manifest-path crates/occt-topo/Cargo.toml --offline --all-targets"
      - "14-model IGES sweep: cargo run --manifest-path crates/occt-topo/Cargo.toml --offline --example iges_read_obj -- _igesdump/oracle/<model>.iges <tmp>/<model>.obj --fstats, FSTAT mv/mt summed"
