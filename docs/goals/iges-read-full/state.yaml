_tmp/tgt_t023, 'cargo test --manifest-path crates/occt-topo/Cargo.toml --offline --lib -- <names>': (a) pre-task code, 3 tests = 'test result: ok. 3 passed; 0 failed; 0 ignored; 0 measured; 1273 filtered out; finished in 3.81s'; (b) add_point fix + own-range + shim removal = 'test bop_builder::tests_api::boolean_split_result_cut_two_pieces ... ok', 'test brepfeat::tests::groove_negative_volume_delta ... FAILED', 'test brepfeat::tests::groove_cuts_cylinder ... FAILED', 'test result: FAILED. 1 passed; 2 failed; ... finished in 1.07s' with 'panicked at src\\brepfeat\\tests.rs:98: groove must remove material: after 9.317485623690741 < before 9.317485623690741' and 'panicked at src\\brepfeat\\tests.rs:222: groove changes the volume (delta 0)'; (c) add_point fix ALONE (the two occt-topo files reverted via 'git checkout --') = 'test result: ok. 3 passed; 0 failed; 0 ignored; 0 measured; 1273 filtered out; finished in 3.40s', so that fix is inert on these tests; (d) own-range + finite_or_unit window rewrite restored + add_point fix = 'test result: ok. 3 passed; 0 failed; 0 ignored; 0 measured; 1273 filtered out; finished in 3.31s', which isolates the failure to the open-box arm. Final state verification: 'cargo check --all-targets' = 'cargo build: 0 errors, 396 warnings'; occt-topo lib = '1276 passed; 0 failed'; occt-core lib = '290 passed; 0 failed; 1 ignored'; step_obj_gates = '4 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 142.56s'; export_data_obj = 15 'ok' lines matching the baseline; 14-model sweep matching the baseline (values listed in the summary). Debug-removal proof: 'rg -c T024DBG crates -g *.rs' returns no matches and 'git diff --stat' reports only 'crates/occt-core/src/bnd/box3d.rs | 31 ++++++-----' and 'crates/occt-topo/src/int_tools_curve_box.rs | 38 ++++++-----' (2 files changed, 41 insertions(+), 28 deletions(-)); pave_ff_perform.rs is not in the diff. A helper file used for the A/B was deleted from _tmp and the untracked scratch co