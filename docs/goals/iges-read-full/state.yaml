      summary: "Triangle-level verdict for the seven models that have an OCCT OBJ baseline (data/output/iges-occ, triangle sets matched by centroid bucket at 1e-4 and vertex-set distance (best of the 6 vertex permutations) at 1e-5): Cube 12/12 exact (distance 0), Extrusion 12/12 exact (0), HoledPlate 128/128 matched (worst 1.77e-6), rev 92/92 matched (worst 8.08e-7) -> these four are triangle-for-triangle OCCT's; Sphere 3392 of 3410 matched, 18 port triangles have no OCCT counterpart within 1e-5 (0.53 percent), counts equal 3410 = 3410; Cone 1619 of 1644 matched, 25 without counterpart and the port has 2 triangles more than OCCT (1644 vs 1642); Offset 782 of 812 matched, 30 without counterpart (3.7 percent). Re-running the same match with reuse allowed gives the same 18/25/30, so those are genuine missing geometry, not a multiplicity artefact of the greedy assignment. The earlier 'bbox plus fan area' gate could not see any of this: it passed on Sphere/Cone/Offset while 18-30 triangles are somewhere else. For the other seven models (Cylinder, Torus, Shape, Shape-1, Shape-2, screw, OffsetPlaneHoleEdge) no OCCT triangle baseline exists anywhere in the repo, so the honest statement is that only counts are verified: Cylinder agrees per face and in face order with occt_probe --facestats 0.04 0.349066 (92/90 lateral, 36/34 cap, 36/34 cap = 164/158 both sides, and the port's lateral face is face 0 in both), and triangle-level parity is UNVERIFIED for it. Two comparison traps found and now documented: (1) occt_probe --facestats prints a face's BRepBndLib box, not its mesh box, so its per-face bbox cannot be used as an identity key against mesh vertices; for HoledPlate it reports z from -0.153719 to 5.153719 and -1.071807 to 6.071807 on the hole faces while both meshes (the port's and OCCT's own iges-occ OBJ) stay inside 0..5 - the port's OBJ is bbox (0,0,0)~(100,80,5) with 180 vertices exactly like data/output/iges-occ/HoledPlate.obj. (2) total node/triangle sums hide permut