      summary: "The tail of process_iges_shape called brep_lib_same_parameter::same_parameter_shape, i.e. BRepLib::SameParameter (BRepLib.cxx:1016-1140, :1251-1739), while OCCT's ShapeFix_Shape::Perform runs SameParameter(myResult, false, aPS.Next()) at ShapeFix_Shape.cxx:259-261, which is the 4-argument overload at :307-311 and therefore ShapeFix::SameParameter(sh, enforce, 0.0) (ShapeFix.cxx:70-275) with a null message registrator. The two are different functions: ShapeFix::SameParameter works per edge through ShapeFix_Edge::FixSameParameter over the ancestor faces of TopExp::MapShapesAndAncestors and then runs a planar tolerance stage (ShapeFix.cxx:182-258) that BRepLib has no equivalent of. The arm is gated by the distinct key FixSameParameterMode (ShapeProcess_OperLibrary.cxx:813), which is -1 on both read paths: the legacy map sets FromIGES.FixShape.FixSameParameterMode = -1 (IGESData.cxx:116) and FromSTEP... = -1 (STEPControl_Controller.cxx:211), and DE_ShapeFixParameters.hxx:39 defaults FixSameParameterMode to FixMode::FixOrNot = -1, which XSAlgo_ShapeProcessor.cxx:679 writes. NeedFix(-1) is true (ShapeFix_Root.lxx:100-104), so OCCT runs this function at the tail of FixShape on the IGES path. New module shhealing/shape_fix_same_parameter.rs follows cxx:70-275 arm by arm: iatol is preci > 0 and preci reaches the function only through iatol/tol (cxx:99-100, :125-128), so the preci argument cannot change a result and the cxx:125-128 tolerance read is kept only as the control-flow marker it is; enforce writes SameRange/SameParameter false (cxx:129-133); the ancestor list is TopExp::MapShapesAndAncestors (TopExp.cxx:80-120), ported as topo_tools_full::map_shapes_and_ancestors, which appends the ancestor inside the inner walk so an edge met twice under one face is listed twice and which inserts the empty list for every sub-shape that has no ancestor (cxx:110-119); the edge loop is TopExp_Explorer(shape, TopAbs_EDGE) so a shared edge is fixed once per occurrence (topo_tools_full::explorer_shapes with is_more_complex/should_avoid from TopExp_Explorer.cxx:26-35 :110-172); the no-ancestor arm is the K2-SEP97 empty-face overload (ShapeFix_Edge.cxx:790-794, tolerance default 0.0 at hxx:193) and is wired to wire_fix::same_parameter::fix_same_parameter_no_face, whose null-face branch walks every CurveOnSurface representation (ShapeFix_Edge.cxx:874-882); the per-edge status write and the status flag follow cxx:151-168, where the else-if message arm is dead because theMsgReg is null; update_tolerances_on_planes follows cxx:182-258 (Geom_Plane directly or as the basis of one Geom_RectangularTrimmedSurface, a second trim level rejected as a null down_cast, cxx:193-205), samples 23 parameters par = (f*(22-i) + l*i)/22, keeps the maximum squared distance from the 3D curve to the projected point, computes tol = 1.00005*sqrt(tol2) and writes only when the value does not shrink the edge tolerance, through B.UpdateEdge plus B.UpdateVertex on the edge's TopoDS_Iterator vertices (= iterator::cumulated_children) at cxx:244-255. A/B against the previous body, measured not assumed: the BRepLib call was restored temporarily and all 14 oracle models re-run through iges_read_obj --fstats; every total is identical - Cube 24/12, Extrusion 24/12, HoledPlate 180/128, Cone 863/1644, Sphere 1725/3410, rev 104/92, Offset 672/812, OffsetPlaneHoleEdge 40/24, Cylinder 271/287, screw 705/892, Shape-1 6074/9757, Shape-2 3029/4675, Shape 2798/4560, Torus 1642/3122 - and byte-level comparison of the 14 OBJ pairs shows 13 files identical in vertex order and face order, with Shape-2 holding the same 3029 vertices in the same order and the same 4675-triangle multiset but 74 face records emitted in a different order. That permutation is the only observable effect of the swap on this corpus; the mesh geometry, the bbox and the fan area are unchanged, so the swap moves the code to the cxx call without moving any accepted number. Seven-oracle gate re-run against data/out