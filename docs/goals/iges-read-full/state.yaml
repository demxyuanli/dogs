  - id: T027
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Adjudicate why _igesdump/oracle/Torus.iges (this implementation's own STEP -> IGES output) reads back as a broken 302/146 fragment while FreeCAD shows a complete torus, without any heuristic: decide whether the defect is in the writer, the reader, or the port."
    inputs:
      - "crates/occt-topo/src/iges.rs (write_iges, a port of IGESControl_Writer)"
      - "src/DataExchange/TKDEIGES/IGESToBRep/IGESToBRep_TopoSurface.cxx:1219-1376 (TransferTrimmedSurface), :699-880 (TransferSurfaceOfRevolution)"
      - "src/DataExchange/TKDEIGES/IGESToBRep/IGESToBRep_TopoCurve.cxx (TransferCurveOnFace) and IGESToBRep_IGESBoundary.cxx (Transfer), both V7_8_1 and V8_0_0"
    constraints:
      - "No port change: the goal is adjudication with live OCCT evidence, not a fix."
      - "Every claim measured on OCCT 8.0.0 (D:/source/occt-8.0.0) and OCCT 7.8.1 (bundled in FreeCAD 1.1)."
    verify:
      - "specs/occt_probe/run_zz_iges_obj.bat _igesdump/oracle/Torus.iges 0.096 0.3490658503988659"
      - "specs/occt_probe/run_zz_iges_obj.bat data/Torus.step 0.096 0.3490658503988659"
    stop_if:
      - "The divergence can only be resolved by a code path outside this repository."
    expected_output:
      - "A written root cause naming writer vs reader and the OCCT versions involved."
    receipt:
      summary: "ROOT CAUSE IS UPSTREAM, IN THE OCCT 8.0.0 IGES ROUND-TRIP, NOT IN THE PORT. (1) THE WRITER IS FAITHFUL AND BYTE-IDENTICAL. Writing data/Torus.step with OCCT 8.0.0's own IGESControl_Writer (specs/occt_probe/run_probe_iges.bat data/Torus.step --iges _tmp/t024mesh/occt_torus.iges) produces 144 + 120 (SurfaceOfRevolution, startAngle 0) + 142(0,3,15,25,3) + 102, i.e. NOT an analytic 198 ToroidalSurface; the file is 5427 bytes and diffs against _igesdump/oracle/Torus.iges in exactly two lines, the G-section date stamp. So the port's iges.rs reproduces IGESControl_Writer, including its torus -> revolution-surface choice. (2) OCCT 8.0.0 CANNOT READ ITS OWN OUTPUT. Reading with OCCT 8.0.0 (run_zz_iges_obj.bat) gives faces=1 wires=2 edges=8: 144 #1 declares outer=1 nInner=0 (ONE boundary loop, read from the IGES model itself), 142 #7 has crv3d=set uv=set, and the face comes out Geom_SurfaceOfRevolution uperiodic=2pi vperiodic=2pi with UV window [0,2pi]x[-3.1415927,9.4247780] (4pi, TWO v periods) carrying TWO wires on the face: wire0 = 4 Bspline edges with pcurve v in [-pi,pi], wire1 = 4 Circle edges with pcurve v in [pi,3pi] - the same loop duplicated one period apart. Meshing that gives 302 nodes / 146 triangles, bbox (-8,-8,-2)-(12,8,2), area 67.2434 against the true torus area 789.5684. (3) OCCT 7.8.1 READS THE SAME FILE CORRECTLY. FreeCAD 1.1 bundles OCCT 7.8.1 (C:/Program Files/FreeCAD 1.1/bin/TKDEIGES.dll FileVersion=7.8.1, against 8.0.0 for the probe); Import.open gives 1 face, 1 wire, 4 edges, surface Geom_SurfaceOfRevolution v-window [0,2pi]x[pi,3pi] (ONE period), area 789.568352, and MeshPart.meshFromShape(0.096, 0.3490658503988659) gives 1639 points / 3122 facets, bbox (-11.98,-11.99,-2)-(12,11.96,2) - the complete torus. Feeding that 1-wire face to OCCT 8.0.0's BRepMesh reproduces it (1642/3122), so the mesher is not the variable. (4) IT IS THE READER, NOT THE WRITER, THAT DIFFERS: exporting the torus to IGES with FreeCAD's 7.8.1 writer (Part.export) gives a 5427-byte file with the same structure (144 + 120 + 142(0,3,15,25,3) + 102, no 198), differing from the port's file only in the G-section version strings/time stamp/author and three 124 entries where the port writes '-0.' and 7.8.1 writes '0.'; OCCT 8.0.0 reads THAT file to the same 2-wire / 4pi-window / 302-146 fragment. Identical inputs, so 8.0.0's IGES read path is the differentiator. (5) THE FILE VARIANT EXPERIMENT PINS THE TRIGGER: editing only the 142 record of the oracle (still 80 columns) gives, dropping Curve3D (crv3d=null uv=set) window [0,2pi]x[pi,3pi] and 1642/3122; dropping CurveUV (crv3d=set uv=null) window [0,2pi]x[pi,3pi] and 739/1332; PreferenceMode=2 the same 2pi window with an empty mesh; the unmodified record with both representations and PreferenceMode=3 is the only one that widens to two periods, i.e. 8.0.0 only produces the 4pi window when the phase-inconsistent 3D and 2D representations are both present. (6) THE SUSPECT CODE IS UNCHANGED BETWEEN THE VERSIONS: IGESToBRep_TopoSurface::TransferTrimmedSurface, IGESToBRep_TopoCurve::TransferCurveOnFace (both call IGESToBRep_IGESBoundary::Transfer with start->Curve3D() and Curves2d={start->CurveUV()}) and IGESToBRep_IGESBoundary::Transfer itself (the 3D+2D arm builds ONE edge per segment by copying the pcurve onto the 3D edge and adds one wire per segment) are logically identical in V7_8_1 (D:/source/OCCT-src, fetched) and V8_0_0 - only formatting and Handle -> occ::handle differ. The split therefore lives in a shared helper below these functions and was NOT localized further; that needs an OCCT 7.8.1 build to bisect. Net: the port matches its 8.0.0 spec to 1e-7 on both the write and the read side, so this is an OCCT 8.0.0 regression and the oracle file is a faithful reproduction of a broken round-trip, not a usable correct-output baseline. No port code was changed. (7) ACTIONABLE CAUSE IS THE WRITE MODE AND IT REPRODUCES A CLEAN ROUND-TRIP WHEN CHANGED: GeomToIGES_GeomSurface.cxx:576-598 sends an analytic surface to its analytic transfer only under 'if (myBRepMode && myAnalytic)' - Geom_ToroidalSurface -> TransferToroidalSurface (:1402-1417, IGESSolid_ToroidalSurface) gives a 198, otherwise TransferSurface gives the generic 120 revolution surface; the same guard covers Geom_CylindricalSurface (:546-562), Geom_ConicalSurface (:564-573) and Geom_SphericalSurface (:575-587). The port and the --iges oracle use Faces mode (IGESControl_Writer('MM', 0), occt_probe.cpp:2096-2099, the mode iges.rs ports), so myBRepMode is false and every elementary surface takes the generic arm. Writing data/Torus.step in BRep mode (zz_iges_obj --iges data/Torus.step out.iges 1) emits '198,9,11,10.,2.,13;' instead of '144 + 120', and OCCT 8.0.0 reads it back as 'read faces=1 wires=1 edges=4', 'face surface=Geom_ToroidalSurface uperiodic=1 vperiodic=1 uv=[0,2pi]x[3.1415927,9.4247780]', 'plain faces=1 wires=1 nodes=1369 triangles=2592 bbox=(-12,-12,-2)-(12,12,2)' - the complete torus, exactly the STEPControl_Reader result. So the fragment is a property of the Faces-mode generic encoding, not of the torus, the reader alone, or the port."
      evidence: "Writer parity: 'Torus.iges 5427' / 'occt_torus.iges 5427' and 'git diff --no-index' reporting '1 file changed, 2 insertions(+), 2 deletions(-)' with the only changed lines being G0000003/G0000004 (date stamp). Read of the port's file under 8.0.0: 'read faces=1 wires=2 edges=8 null=0 nofix=0', 'IGES 144 #1 outer=1 nInner=0 outerType=IGESGeom_CurveOnSurface', 'IGES 142 #7 pref=3 crv3d=set uv=set', 'face surface=Geom_SurfaceOfRevolution uperiodic=1(u=6.28319) vperiodic=1(v=6.28319) uv=[-0.0000000,6.2831853]x[-3.1415927,9.4247780]', 'wire 0 edges=4 total_range=25.1327 ... 3dtype=6 haspcurve=1 pcurve_uv=(6.2832,-3.1416)-(-0.0000,-3.1416)', 'wire 1 edges=4 ... 3dtype=1 closed ... pcurve_uv=(0.0000,3.1416)-(0.0000,9.4248)', 'plain faces=1 wires=2 nodes=302 triangles=146 bbox=(-8.0000,-8.0000,-2.0000)-(12.0000,8.0000,2.0000)'. FreeCAD 1.1 (OCCT 7.8.1): 'TKDEIGES.dll FileVersion=7.8.1'; 'obj Part__Feature faces=1 wires_total=1 edges_total=4', 'face 0 type=Part::GeomSurfaceOfRevolution area=789.568352 nwires=1', 'wire 0 edges=4 area=0.000000 closed=True'; 'freecad:Part__Feature faces=1 points=1639 facets=3122 bbox=(-11.980518,-11.993017,-1.999296)-(11.997182,11.959696,1.999296)'; port OBJ vs FreeCAD OBJ areas 'freecad=786.6611' / 'port=67.2434' against 'true torus area 789.5684'. Reverse direction: FreeCAD-exported IGES read by 8.0.0 = 'IGES 142 #7 pref=3 crv3d=set uv=set', 'face ... uv=[-0.0000000,6.2831853]x[-3.1415927,9.4247780]', 'wire 0 edges=4 ... wire 1 edges=4', 'plain ... nodes=302 triangles=146 bbox=(-8.0000,-8.0000,-2.0000)-(12.0000,8.0000,2.0000)'; its diff against the port's file is '14 +++++++-------' (G0000001..G0000004 plus 124 entries '124,1.,0.,-0.,...' vs '124,1.,0.,0.,...'). Variant experiment (one record changed, '142,0,3,15,25,3;'): 'nomdl 142,0,3,15,0,3;' -> uv=[0,2pi]x[3.1415927,9.4247780], 1642/3122; 'nouv 142,0,3,0,25,3;' -> uv=[0,2pi]x[3.1415927,9.4247780], 739/1332; 'pref2 142,0,3,15,25,2;' -> uv=[0,2pi]x[3.1415927,9.4247780], nodes=0 triangles=0; baseline -> uv=[0,2pi]x[-3.1415927,9.4247780], 302/146. Mode experiment: 'iges-write in=data/Torus.step out=_tmp/t024mesh/t_face.iges mode=0 ok=1' with entity types '144,3,1,0,13;' / '120,7,9,0.,6.283185307;' / '142,0,3,15,25,3;', against 'iges-write ... t_brep.iges mode=1 ok=1' with '198,9,11,10.,2.,13;'; reading t_brep.iges gives 'read faces=1 wires=1 edges=4', 'face surface=Geom_ToroidalSurface uperiodic=1(u=6.28319) vperiodic=1(v=6.28319) uv=[-0.0000000,6.2831853]x[3.1415927,9.4247780]', 'plain faces=1 wires=1 nodes=1369 triangles=2592 bbox=(-12.0000,-12.0000,-2.0000)-(12.0000,12.0000,2.0000)'. Source extraction: 'D:/source/OCCT-src' at V8_0_0 with V7_8_1 fetched, 7.8.1 path src/IGESToBRep/, 8.0.0 path src/DataExchange/TKDEIGES/IGESToBRep/; TopoCurve.v7 IGESToBRep_TopoCurve::TransferCurveOnFace:491-546 equals TopoCurve.v8:512-579; IGB.v7 IGESToBRep_IGESBoundary::Transfer:132-269 equals IGB.v8:127-339 (the 3D+2D arm at v7:207-255 / v8:242-323). GeomToIGES_GeomSurface.cxx:576-598 (the 'myBRepMode && myAnalytic' guards), :1402-1417 (TransferToroidalSurface -> IGESSolid_ToroidalSurface)."
      artifacts:
        - "docs/goals/iges-read-full/state.yaml"
      checks:
        - name: writer_is_byte_identical_to_occt_8_0_0
          status: pass
        - name: occt_8_0_0_fragments_its_own_output
          status: pass
        - name: occt_7_8_1_reads_the_same_file_as_a_full_torus
          status: pass
        - name: reader_is_the_differentiator_identical_file_structure
          status: pass
        - name: top_level_reader_functions_identical_between_versions
          status: pass
        - name: brep_mode_198_round_trips_to_a_full_torus
          status: pass
        - name: port_unchanged
          status: pass
    receipt_note: "Oracle policy is still open. The fragment traces to the Faces-mode generic surface encoding (144 + 120 revolution + a phase-inconsistent 142), which OCCT 8.0.0 cannot read back; BRep mode writes a 198 analytic torus and round-trips exactly. Choosing between (a) keeping the Faces-mode parity the oracle uses, (b) writing analytic 198/194/192/196 elementary surfaces so the round-trip works, or (c) regenerating/annotating the oracle is a user decision."

