    expected_output:
      - "The named missing cxx arm, the 4-line port of it, and the 14-model sweep against the probe."
    receipt:
      summary: "ONE MISSING CXX ARM, PORTED IN 4 LINES; NO HEURISTIC WAS NEEDED. (1) The cause was isolated to the V resolution of a surface of revolution whose generatrix is a LINE. GeomAdaptor_SurfaceOfRevolution::VResolution returns myBasisCurve->Resolution(R3d) (GeomAdaptor_SurfaceOfRevolution.cxx:363-366) while UResolution stays Precision::Parametric(R3d) (:356-359), and GeomAdaptor_Curve::Resolution returns R3D unchanged for GeomAbs_Line (GeomAdaptor_Curve.cxx:1116-1121) - a line's parameter is arc length - falling back to Precision::Parametric(R3D) = R3D * 0.01 only in the default arm (:1146-1147, Precision.hxx:328). The port's GeomLine had no resolution override, so it took Curve::resolution's trait default (curve.rs:131-137), the same Precision::Parametric value. At Shape-1's own lin = 0.308 that is 3.08e-3 where OCCT gives 3.08e-1, i.e. a VResolution 100x too small. Measured: 96 of the 100 revolution faces print a line generatrix, and every one of them printed rv=3.080000e-3 before the fix and rv=3.080000e-1 after; the four circle-generatrix groups are untouched (rv=1.232780e-1, 1.622833e-1, 5.191435e-1, each exactly 2*asin(R3d/(2R))). (2) The 100x error propagates through BRepMesh_NURBSRangeSplitter::computeGrainAndFilterParameters (BRepMesh_NURBSRangeSplitter.cxx:540-565): aDiffMinLim = max(0.005 * theRangeDiff, 2 * theTol2d) caps the filter distance at 2*theTol2d. For the pathological face (u=[0,2pi], v=[0,4.36495]) the cap at 2*3.08e-3 = 6.16e-3 lost to 0.005*range = 2.18e-2, so aDiff fell from 0.1*range = 4.37e-1 to 2.18e-2 and the V grain kept ~167 samples where OCCT keeps 10. NURBSGRID on that face printed u_params=171 v_params=141 -> grain u_seq=153 v_seq=120 with tol_v=3.08e-3, against v_seq=10 for the same face family with tol_v=1.62e-1. That is the whole 2.1x: the face carried 2585 nodes / 4995 triangles where OCCT has 236/297. (3) The fix is crates/occt-geom/src/line.rs, four lines, GeomLine::resolution -> r3d with the cxx citation; no other file changed (git diff --stat = line.rs | 4 +). (4) Shape-1 now meshes 3039/3726 against the probe's 3053/3754 at the same lin=0.308 and angle 20 deg, and the pathological face is 236/297, byte-equal to OCCT's 236/297. screw moved 502/602 -> 499/596 against the probe's 500/597, i.e. from +2/+5 to -1/-1. All twelve other models are byte-identical and export_data_obj is unchanged 15/15. (5) The remaining Shape-1 residual is a different, much smaller divergence, reported and NOT touched: 4 faces are OCCT 40/52 against the port's 36/44 and one face is OCCT 216/223 against the port's 218/227, totalling -14 nodes / -28 triangles. (6) Side findings, reported and not fixed: (a) GeomTrimmedCurve::resolution (crates/occt-geom/src/trimmed.rs:148-153) divides the basis resolution by (last-first), which fits the port's [0,1]-reparameterised trimmed view but not OCCT's adaptor, which unwraps Geom_TrimmedCurve to its basis (GeomAdaptor_Curve.cxx:60-140) and keeps the basis parameterisation - so a trimmed LINE would give R3D in OCCT and R3D/span here; no corpus model reaches it (all 96 revolution generatrices print trimm=false). (b) CurveReparam::resolution (crates/occt-geom/src/curve_reparam.rs:91-97) and basis_parameter_curve.rs:109 were not audited. (c) The probe's Shape-1 totals are so angle-sensitive that the T026 figure does not reproduce: --facestats/--mesh give 3007/3670 at angle=0.349066 but 3053/3754 at 0.3490658503988659 (the port's own 20 deg), a 1.5e-7 rad change that flips five faces including the 60-face model's largest (429/762 against 415/734); the recorded 3021/3698 matches neither value and must be re-measured before reuse."
      evidence: "cargo check --manifest-path crates/occt-topo/Cargo.toml --offline --all-targets = 'cargo build: 0 errors, 397 warnings'. GeomAdaptor_Curve.cxx:1116-1148 read verbatim: 'case GeomAbs_Line: return R3D;' then Circle '2 * std::asin(R3D / (2 * R))', Ellipse 'R3D / MajorRadius', Bezier/BSpline via their own Resolution, 'default: return Precision::Parametric(R3D);'; Precision.hxx:328 'static constexpr double Parametric(const double P) { return P * 0.01; }'; GeomAdaptor_SurfaceOfRevolution.cxx:356-359 / :363-366. Instrument (temporary, removed): NURBSGRID print in uv_resolution gave 'REVGEN r3d=0.308000 rv=3.080000e-3 line=true circ=false ell=false hyper=false parab=false nurbs=None bez=None off=false trimm=false' for 48 of the 96 revolution faces and 'REVGEN r3d=0.308000 rv=1.622833e-1 line=false circ=true ...' for 24, 'rv=1.232780e-1' for 24, 'rv=5.191435e-1' for 2; after the fix the same 96 faces print 'line=true ... rv=3.080000e-1'. NURBSGRID range-splitter print, same face before/after: 'pre type=SurfaceOfRevolution u_params=171 v_params=141 ... tol_v=3.080000e-3 defl=0.308' + 'grain u_seq=153 v_seq=120', against 'pre ... u_params=15 v_params=26 ... tol_v=1.622833e-1 ... grain u_seq=7 v_seq=10' for the circle-generatrix family. Per-face FSTAT on Shape-1 before: face=29 mv=2585 mt=4995 and total 6498/10644; after: face=29 mv=236 mt=297 and total 3039/3726. 14-model sweep after the fix (port, FSTAT mv/mt summed, at each model's own printed lin): Cube 24/12, Sphere 1725/3410, Cone 863/1644, Cylinder 164/158, Extrusion 24/12, HoledPlate 180/128, Offset 672/812, OffsetPlaneHoleEdge 40/24, rev 104/92, screw 499/596, Shape 7191/13433, Shape-1 3039/3726, Shape-2 3037/4691, Torus 302/146. Probe at the same lin and 0.3490658503988659: Cube 24/12, Sphere 1725/3410, Cone 863/1644, Cylinder 164/158, Extrusion 24/12, HoledPlate 180/128, Offset 672/812, OffsetPlaneHoleEdge 40/24, rev 104/92, Torus 302/146 (ten exact), screw 500/597, Shape 7192/13435, Shape-1 3053/3754, Shape-2 3033/4683. Face-count check: 60/60 on Shape-1, 14/14 models agree on face counts. Angle sensitivity, probe run twice per value: 'angle=0.349066 nodes=3007 tris=3670' both runs, 'angle=0.3490658503988659 nodes=3053 tris=3754' both runs; --mesh 0.308 0.3490658503988659 gives the same 3053/3754 with 'TOTAL faces=60 nodes=3053 triangles=3754'. Sorted per-face multiset at 0.3490658503988659: OCCT '... 33/39 x12, 40/52 x4, 52/52 x2, 56/78 x6, 57/79 x2, 72/72, 76/74, 165/218, 179/186, 184/182, 216/223, 236/297, 429/762' against the port's '... 33/39 x12, 36/44 x4, 52/52 x2, 56/78 x6, 57/79 x2, 72/72, 76/74, 165/218, 179/186, 184/182, 218/227, 236/297, 429/762'. Tests: occt-geom lib = 'test result: ok. 143 passed; 0 failed'; occt-topo lib = 'test result: ok. 1276 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 795.81s'; step_obj_gates = 'test result: ok. 4 passed; 0 failed' (cylinder_step_mesh_covers_full_u_period, step_obj_parity_bboxes_match_occt, step_to_obj_exports_valid_obj, step_obj_area_matches_occt); export_data_obj = 15/15 'ok' lines byte-identical to the recorded baseline (Cone 195/301, Cube 24/12, Cylinder 146/140, Extrusion 24/12, HoledPlate 180/128, Offset 712/892, OffsetPlaneHoleEdge 48/32, Shape-1 3335/4328, Shape-2 3081/4744, Shape 6150/11372, Sphere 642/1244, Torus 1369/2592, linkrods 3494/5078, rev 104/92, screw 601/792)."
      artifacts:
