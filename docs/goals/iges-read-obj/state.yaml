# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "IGES read side to OBJ"
  slug: "iges-read-obj"
  kind: specific # specific | open_ended | existing_plan | recovery | audit
  tranche: "Port the OCCT IGES reader far enough to load the seven oracle IGES files whose writer already matches, mesh them at deflection 0.1, and match existing STEP bbox and area baselines."
  status: done # active | blocked | done
  oracle:
    signal: "cargo check is clean; reading _igesdump/oracle IGES for Cube, Sphere, Cone, Extrusion, HoledPlate, rev, and Offset produces OBJ; bbox and area match the existing STEP mesh baseline within tolerances already in tests/common/mod.rs."
    cadence: "after each Worker package and at final audit"
    final_proof: "T999 Judge receipt mapping the three oracle items to receipts and command output, with full_outcome_complete: true."
  intake:
    original_request: "Implement the IGES read side, read IGES, and write OBJ. First show a task board, then start the long run."
    interpreted_outcome: "A Rust IGES reader following OCCT IGESToBRep control flow loads oracle IGES and writes OBJ that matches existing STEP mesh bbox and area."
    input_shape: specific # vague | specific | existing_plan | recovery | audit
    audience: "project owner (OCCT to Rust geometry port)"
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: artifact # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "Seven oracle IGES files read to OBJ; bbox and area inside existing step_obj_parity tolerances; cargo check 0 errors. No new tests."
    likely_misfire: "Treat port-written IGES as the spec; add per-model heuristics to hit vertex counts; stop after cargo check or a header parse; write new unit tests; pull unfinished writer diffs into this tranche."
    blind_spots_considered:
      - "Revolution surfaces rebuilt from entity 120 may mesh to different vertex counts than a direct STEP read. Judge bbox and area with existing tolerances. Report vertex counts; do not snap them."
      - "The spec is OCCT IGESControl_Reader / IGESToBRep on _igesdump/oracle files, not the Rust writer."
      - "The worktree has unrelated meshing and healing edits plus dump files. Workers must not revert or stage them."
      - "The IGES writer module (crates/occt-topo/src/iges/, the former single file iges.rs) was already over 1000 lines. Reader code goes in new files named for the OCCT class."
      - "Full cargo test is pre-commit only. This tranche does not commit."
    existing_plan_facts:
      - "Writer is pushed. Faces mode is entity 120 plus 124. Group 402 form is 1. Global section is IGES 5.3, version 11, precision 308/15."
      - "Parameter-string match versus oracle: Cube, Sphere, Cone, Extrusion, HoledPlate, rev, Offset."
      - "Existing STEP mesh counts from step_obj_parity: Cube 24/12, Cone 195/301, Sphere 642/1244, HoledPlate 180/128, rev 104/92, Offset 712/892. Extrusion counts come from a live export_data_obj run, not a remembered number."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  # Bundled goal_*.toml lives in the GoalBuddy skill. This Cursor session can spawn goal-scout, goal-judge, and goal-worker.
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live # not_requested | starting | live | generated | blocked
    url: "http://goalbuddy.localhost:41737/iges-read-obj/"
    command: "npx goalbuddy board docs/goals/iges-read-obj"

active_task: null

