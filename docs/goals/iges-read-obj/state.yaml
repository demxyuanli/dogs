      - "OBJ export function and deflection already used by export_data_obj."
      - "Largest safe first Worker slice, with candidate files. Do not implement it."
    receipt:
      result: done
      summary: "No Rust IGES reader exists. Read path is IGESControl_Reader to IGESFile_Read to IGESToBRep_Actor::Transfer. Cube, Extrusion, and HoledPlate use only 402 form 1, 144, 108, 142, 102, and 110. Reuse brep_to_obj; argument 0.1 is the void-box fallback, real deflection is max bbox edge times 0.001 times 4."
      evidence:
        - "IGESControl_Reader.cxx:52-58 ctor, :82-121 NbRootsForTransfer. XSControl_Reader.cxx:106-110 ReadFile, :273-297 TransferRoots, :330-349 OneShape."
        - "IGESSelect_WorkLibrary.cxx:73-82 calls IGESFile_Read.cxx:76-94."
        - "IGESToBRep_Actor.cxx:135-196 Transfer calls TransferGeometry at :196. ProcessShape at :204-218 is a separate branch."
        - "IGESToBRep_CurveAndSurface::TransferGeometry :214-445, 402 form 1 at :369-445. TopoSurface trimmed plane :209-212 and :229-232."
        - "Entity counts: Cube and Extrusion 402/144/108/142/102/110 only. HoledPlate same types, 32 faces. Sphere, Cone, rev, Offset also need 100, 120, 124; Offset also needs 126."
        - "crates/occt-topo/src/iges/ is write-only (write_shape_iges, iges/entry.rs:23; was iges.rs:4239 before the split). crates/occt-topo/examples/export_data_obj.rs:96 calls brep_to_obj(&shape, 0.1). prs3d_get_deflection uses DEVIATION_COEFFICIENT 0.001."
        - "tests/common/mod.rs:38-45: BBOX_EXACT 1e-6, AREA_EXACT 1e-3, AREA_CURVED 0.04, AREA_COMPLEX 0.05. Cube and Extrusion use the exact pair."
      ambiguity:
        - "Actor::Transfer always runs XSAlgo_ShapeProcessor::ProcessShape at IGESToBRep_Actor.cxx:204-218. First geometry slice can mark that pass unported."
