    input_shape: specific # vague | specific | existing_plan | recovery | audit
    audience: "project owner (OCCT to Rust STEP reading and meshing port)"
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: metric # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "Per-segment cxx audit complete; confirmed divergences fixed on the same OCCT branch; step_obj_gates 4/4; export counts equal OCCT baseline; cargo check 0 errors."
