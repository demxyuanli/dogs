      inversion:
        - "brep_tools -> meshing: the triangulation dump (BRepTools::Write of a Poly_Triangulation) is a mesh algorithm, so write_triangulation stayed in occt-topo as brep_tools_write; occt-topo re-exports it and every call site kept its path."
        - "brep_tools -> mesh: mesh data structures already live in occt-core::poly, so no algorithm edge remained."
        - "brep_bnd_lib / brep_tools_uv / brep_uv_bounds -> int_tools_curve_box, bnd_lib_add2d, geom_bnd_lib_surface3d: those are GeomBndLib_* / BndLib_Add2dCurve bounds math, moved down to occt_geom::{geom_bnd_lib, geom_abs_curve_type} and re-exported from occt-topo under their old module names."
