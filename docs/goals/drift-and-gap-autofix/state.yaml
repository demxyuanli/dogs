      summary: "P006 closed and committed (B6a / T-136, commit hash recorded in the paired board-advance commit). The three fabricated Extrema fallbacks are gone: `extrema_surf/numeric_extrema.rs::fallback_point_surface` (40x40 grid + coordinate descent), `fallback_curve_surface` (20x16x16 grid) and `extrema_ss.rs::fallback_ss` (12^4 grid) are deleted, and `point_surface_extrema` / `curve_surface_extrema` / `surface_surface_extrema` now return `Option<ExtremaPair>` where `None` is `!IsDone()` or `NbExt() == 0` (`Extrema_ExtPS.cxx:307-371`, `Extrema_ExtCS.cxx:122,532`, `Extrema_ExtSS.cxx:226-260`, `Extrema_ExtElSS.cxx:62-83`), matching the encoding the same family already used after batch 17 for `extrema_pc` / `extrema_cc`. The `occt_geom::extrema` wrappers follow. The decisive part is the consumer: `bean_face_exact::ComputeUsingExtremum`'s `candidates.is_empty()` arm, which used to call `curve_surface_extrema(..., 16)` to invent a pair, is replaced by the real `IntTools_BeanFaceIntersector.cxx:956` guard -- when `Extrema_ExtCS` is not done or has no extremum the whole block is skipped, so neither a range nor the range flag is touched and `i` advances by one; `SetFlag(i, 1)` is only reached when the run is done and no solution was found (`cxx:1070`). The other two consumers follow the same cxx semantics: `closest_point_on_face` skips its in-face projection step on `None`, and `gprop_analytic::extrema_point_surface_exact`'s non-elementary arm returns `Err` through the function's existing error channel. A prior registration in `_audit/_index.md` A15 claimed these fallbacks had to stay because a live consumer relied on them and that removal was gated on T-67 (`Extrema_GenExtPS`); that premise is false -- the consumer's own branch is the not-done case -- and the correction is recorded in A15, T-136 and the drift canvas. Scope: no new predicate, no new test, no relaxed gate; 10 existing call sites got an `.expect(\"... done\")` and nothing else changed. Seventh cycle complete: scout (cxx re-read of Extrema_ExtPS/ExtCS/ExtSS/ExtElSS and of `ComputeUsingExtremum`), worker, four gates green, commit. **Eighth cycle (T-137 / package P007) then closed the classifier half of B6b**: `classify_plane`/`classify_sphere`/`reconstruct_line` in `occt-geom/src/extrema_surf/analytic_solvers.rs` now delegate to `s.gp_pln()` / `s.gp_sphere()` / `c.gp_line()` (`Extrema_ExtSS.cxx:117-129` dispatches on `S1.GetType()` and takes `S1.Plane()`/`S1.Sphere()`; `Extrema_ExtCS.cxx:129-140` takes `C.Line()`/`myS->Sphere()`/`myS->Plane()`), and the sampled bodies `is_planar` (8x8), `sphere_center` (circumcentre), `circumcenter`, `surface_normal`, `is_line` (6-point tangent) and `sample_bounds` are deleted (`det3`/`solve3` stay; `numeric_extrema.rs:205` uses them). In `occt-geom2d/src/extrema2d` the `is_line2d`/`circumcenter2d`/`classify_circle2d`/`line_of_curve2d` samplers are deleted: `point_curve_extrema2d_all` takes its line arm from `c.gp_lin2d()` and now computes `Mydist` the way `Extrema_ExtPElC2d.cxx:63-79` does (the parameter on the line measured from `L.Location()` along `L.Direction()` -- the old code used the increment relative to `d0(first_parameter)`, which is wrong on a trimmed line), its circle arm from `c.gp_circ2d()`, and `curve_curve_extrema2d_all` dispatches pairs with `gp_lin2d()`/`gp_circ2d()` (`Extrema_ExtCC2d.cxx:104-145`, `GetType(C1)` x `GetType(C2)` + `Extrema_Curve2dTool::Line/Circle`). Observable effect: a curve that is straight but is not a `Geom2d_Line`/`Geom_Line` (degree-1 B-spline, straightened trimmed curve) no longer falls into the analytic line arm, matching OCCT, which reports `GeomAbs_BSplineCurve` and takes the general arm. Two follow-ups were registered instead of being fixed in this package: **B6c** (the `span/0.1` seed grid `build_samples2d` plus `newton_point_curve_all2d` / `newton_curve_curve_all2d` are self-invented substitutes for `Extrema_GGExtPC::IntervalPerform`, `mysample = 17`, and for `Extrema_GGenExtCC` -> `math_GlobOptMin`; live via `brep_class/intersector_checks.rs:157` and `extrema2d/general_extrema.rs:550`) and **B6d** (the analytic sphere/sphere and sphere/plane arms of `surface_surface_extrema_all` have no counterpart in `Extrema_ExtSS::Perform`, which is analytic only for `Plane` x `Plane`). Gates for P007: `--all-targets` 0 errors for `occt-geom2d`/`occt-geom`/`occt-topo`, `occt-geom2d --lib` 72/0, `occt-geom --lib` 143/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 (117s), `export_data_obj` 15/15 with v/f and bbox bit-identical to the T000 baseline. **Ninth cycle (T-138 / package P008) then closed B6c, the grid half of the same line**: the `span/0.1` seed grid and its grid-Newton solvers are deleted (`analytic_solvers.rs::build_samples2d`, `newton_point_curve_all2d`, `curve_curve::newton_curve_curve_all2d`, `fval2d`, `fprime2d`, `dist22d`, `solve_f_zero2d`, `refine_seed2d`, `pair2d_c`, `dedupe_sort2d`) and replaced by two faithful files: `extrema2d/gfunc_ext_pc2d.rs` = `Extrema_GFuncExtPC` (the `Value`/`Values` objective with the `D1`/`DF` singular handling) and `extrema2d/ext_pc2d.rs` = `Extrema_ExtPC2d` = `Extrema_GGExtPC` (`Initialize` sets `mytolu = Resolution(Confusion)`, `type = Curve2dTool::GetType(theC)`, `mysample = 17`, `Extrema_GGExtPC.hxx:119-128`; `Perform` takes the two endpoint distances then switches on `type`: `Line`/`Circle`/`Ellipse`/`Parabola`/`Hyperbola` -> `Extrema_ExtPElC2d`, Bezier -> `mysample = NbPoles()*2` + `IntervalPerform`, BSpline -> the knot/degree arms, `default:` -> `NbIntervals(GeomAbs_C2)` (else `DeflCurvIntervals`) with per-interval `IntervalPerform`; `IntervalPerform` is `Extrema_GGenExtPC` -> `math_FunctionRoots` with `AddSol` merging by `PConfusion()`). `point_curve_extrema2d_all` returns all solutions, `point_curve_extrema2d` returns `Option<Extrema2d>` (matching `Geom2dAPI_ProjectPointOnCurve::Perform`), `curve_curve_extrema2d_all` delegates to `Extrema_ExtCC2d`, and the A16 `UNPORTED` marker on `general_extrema::proj