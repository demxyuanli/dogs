hed. Both are now written into `next.slice`. **Fourteenth cycle (package P013) closed the copy half of that hand-off**: the four remaining byte-similar solvers are gone -- `occt-geom/src/extrema_pc/poly_roots.rs` and `extrema_cc/poly_roots.rs` (local quadratic closed form + `poly4`/`polish4` Newton polish), `occt-geom2d/src/extrema2d/analytic_solvers.rs` (same, plus its own `poly4`) and `occt-core/src/numeric.rs` (`quadratic_roots`/`cubic_roots`, a fourth invented solver with a monic 3-arg cubic and sorted output, no callers outside its own two tests). All three live copies now `pub(super) use occt_core::math_direct_poly_roots::{cubic_roots, quadratic_roots, quartic_roots}`; the two `occt-core/numeric.rs` helpers and their two tests are deleted. Thresholds that disappeared with them: the `1e-14` discriminant cuts, the `1e-12`/`1e-9`/`1e-8`/`1e-6` dedup and residual filters, the `1e-300` leading-coefficient cuts and the local Newton polish; the stale headers claiming `occt-geom does not depend on occt-math` / `occt-geom2d does not depend on occt-geom` went too. One existing assertion that compared the invented ascending order (`extrema_pc/tests.rs:146-152`) was realigned to compare the solver's `Value` list as a set, matching the adjacent cubic/quartic assertions (no test added). Gates for P013: `--all-targets` 0 errors for occt-core/occt-geom/occt-geom2d, `occt-core --lib` 283/0 (-2: the two invented tests deleted), `occt-geom --lib` 143/0, `occt-geom2d --lib` 72/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4, `export_data_obj` 15/15 with per-model v/f identical to the T002 table; commit `8db13d5c`. **Fifteenth cycle (package P014) closed the second B8-intana line, the cone/cone tolerance**: `quadric_quadric_cone_cone` took an extra `tol_ang` parameter and used it as the branch-2 threshold, so every caller decided cone/cone alignment with its own constant (`TOL_ANG = 1e-8` in the BOP pair table, `Precision::Angular()` elsewhere) while `IntAna_QuadQuadGeo::Perform(gp_Cone, gp_Cone, Tol)` (`IntAna_QuadQuadGeo.cxx:1433-1476`) has exactly one input tolerance and derives the angular one. The parameter is gone and the cxx derivation is ported: `aTolAng` starts at `myEPSILON_ANGLE_CONE` (`= Precision::Angular()`, `InitTolerances`, `cxx:351-359`) and is relaxed to `Tol / EstimDist(Con1, Con2)` clamped to `[Precision::Angular(), Tol]`, only when `|tg1 - tg2| < Tol`, `A1A2.Parallel()` and `A1A2.Distance() > 100 * Tol`. `EstimDist` itself (`cxx:260-326`) is ported: the plane through both apexes and the first cone direction (`gce_MakePln(P1,P2,P3)`, `gce_MakePln.cxx:76-92`, `Precision::Infinite()` when not done), both axes projected into it (`ProjLib::Project(gp_Pln, gp_Lin)` = `ProjLib_Plane::Project`, `ProjLib_Plane.cxx:102-107`), each rotated by `+-SemiAngle`, the four line pairs intersected with the ported `IntAna2d_AnaIntersection::Perform(gp_Lin2d, gp_Lin2d)` and `max(min|ParamOnFirst|, min|ParamOnSecond|)` returned. The line projection needed one new faithful helper, `occt-geom/src/projlib.rs::project_pln_lin2d` (built on the existing `eval_pln_pnt2d`/`eval_pln_dir2d` = `ProjLib_Plane.cxx:87-97`; `None` where OCCT's `gp_Dir2d` would raise `Standard_ConstructionError`) -- the cone/cone branch is its only caller. `cxx:1555` was also realigned: the nested plane/cone reduce inside branch 2 is constructed with `(Tol, Tol)`, not with an angular tolerance. Call sites updated: the `intana` dispatcher, `intpatch_impimp_pairs::int_co_co`, `int_face_face_analytic::cone_cone`, and the two existing `intana/tests.rs` cone/cone assertions (no test added). Gates for P014: `--all-targets` 0 errors for occt-geom/occt-topo, `occt-geom --lib` 143/0, `occt-geom2d --lib` 72/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 (190.0s, 23 area ratios matching), `export_data_obj` 15/15 with every v/f and bbox identical to the T002 table (Cone 195/301, Shape-1 3335/4328, Shape-2 3081/4744, Shape 6150/11372, linkrods 3494/5078, screw 601/792); commit `dd31b