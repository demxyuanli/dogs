        slice: "**P031 -- and P030 is closed first: the per-arm diff it ordered found the missing `H` arm and the unported extreme-conic tail, recorded in `packages[P030]`.** Next: give `QuadricIntersection` a declined / not-done state and translate `IntAna_QuadQuadGeo.cxx:922-951` (`EllipseLimit = 1.0E+9` for `IntAna_Ellipse`, `HyperbolaLimit = 2.0E+6` for `IntAna_Hyperbola`, both setting `done = false` and returning), then wire that state to both consumers the block reaches: `intpatch_impimp_pairs`'s `IntPCo` path, where `!inter.IsDone()` makes the pair `return false` (`IntPatch_ImpImpIntersection.cxx:3480-3483`) and leaves the whole `Perform` not done (= this port's `PairOutcome::Fail`), and `cone_cone_analytic` branch 2, which tests the nested plane/cone call with `INTER_QUAD_PLN.IsDone()` (`cxx:1556`). Mapping it onto `None` instead would be `IntAna_Empty`, the opposite meaning, so the enum change is load-bearing rather than cosmetic; every exhaustive `QuadricIntersection` match (`intpatch_impimp_glines`, `int_face_face_analytic`, `intpatch_analytic`, `brep_face_intersect`, `intana_intconicquad`, the two test files) has to state what its caller does with a declined pair, and gates (3)(4) have to be re-run because the BOP intpatch pipeline is shared. Gates: five-crate `cargo check --offline --all-targets` (0 errors), `occt-geom --lib` 143/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 and `export_data_obj` 15/15. **Kept from the closed P030 card as context** -- **P030 (per-arm diff, fix only what the cxx confirms)**: `IntAna_QuadQuadGeo` is 15 `Perform` overloads and 15 are ported; after P027/P028/P029 exactly ten have been line-diffed (Pln/Pln, Pln/Sphere, Cylinder/Sphere, Sphere/Cone, Sphere/Sphere, plus all five torus arms). The five that still have never been read line by line are `Perform(gp_Pln, gp_Cylinder, Tolang, Tol, H)` (`IntAna_QuadQuadGeo.cxx:543-745`), `Perform(gp_Pln, gp_Cone, Tolang, Tol)` (`cxx:752-972`), `Perform(gp_Cylinder, gp_Cylinder, Tol)` (`cxx:1050-1293`), `Perform(gp_Cylinder, gp_Cone, Tol)` (`cxx:1324-1342`) and `Perform(gp_Cone, gp_Cone, Tol)` (`cxx:1433-1886`), against `quadric_quadric_plane_cylinder` / `quadric_quadric_plane_cone` (`crates/occt-geom/src/intana/analytic_intersections.rs`), `quadric_quadric_cylinder_cylinder` / `quadric_quadric_cylinder_cone` / `quadric_quadric_cone_cone` (`crates/occt-geom/src/intana/line_torus.rs`). P015's notes on the cylinder/cylinder and cylinder/cone arms (`RealSmall()` at `cxx:1104`, `myEPSILON_CYLINDER_DELTA_RADIUS` at `cxx:356`, the cone/cone re-mapping at `cxx:1557-1603`) are evidence about a stray citation and a re-mapping, not a line diff, so they count as unverified until re-read. Look for: bare `f64::EPSILON` / `1e-9` / `1e-12` / `1e-13` / `1e-20` not tied to a named cxx tolerance, early returns with no cxx counterpart, and cxx arms with no Rust branch. Also fold in the census method correction: walk `mod` declarations (`crates/occt-geom/src/intana/mod.rs`), not directories, when a class is split across `#[path]` files. Gates: five-crate `cargo check --offline --all-targets` (0 errors), `occt-geom --lib` 143/0, `occt-topo --lib` 1251/0, plus `step_obj_gates` 4/4 and `export_data_obj` 15/15 because `intana` sits on the intpatch/BOP shared pipeline."
        rationale: "P030 closed the per-arm pass the way the previous four cycles suggested it would: the two arms nobody had ever read (`cxx:543-745` Pln/Cylinder and `cxx:752-972` Pln/Cone) both turned out to carry something, one a whole missing cxx arm plus a missing consumer parameter and the other an unported refusal block, while the three arms that had prior reviews (`cxx:1050-1293`, `cxx:1324-1342`, `cxx:1433-1886`) came back faithful. That is the third consecutive cycle in which reading an arm changed what the board believed, so P031 is picked as the smallest piece that can still change behaviour on this class: the `EllipseLimit`/`HyperbolaLimit` block is the only remaining cxx control flow of `IntAna_QuadQuadGeo` with no counterpart, and it is reachable from two different consumers, which is exactly why it must not be approximated by `None`. Deferring it to a later tranche would leave a known, cited, behaviour-bearing branch untranslated while the board declares the class done. P028's census was wrong in the direction that hides work and P029 is what caught it, which is the strongest argument for continuing the per-arm pass: the class is 15 overloads split across two files plus one `#[path]` module, so every aggregate statement about it (\"closed\", \"unported\", \"10 of 15\") has been wrong at least once. P029 settled the torus half and found a real invented branch there; the remaining five arms are the last place a similar construct can still be hiding, and two of them (`cxx:543-745` Pln/Cylinder and `cxx:752-972` Pln/Cone) are the largest of the whole class, while `cxx:1050-1293` (Cylinder/Cylinder) is the one whose only prior review was a citation check. Running the T999 audit before these five are read would repeat exactly the failure P027 and P028 both recorded. The census-method correction belongs in the same slice so the next reader does not re-derive `intana_torus.rs` from scratch."
