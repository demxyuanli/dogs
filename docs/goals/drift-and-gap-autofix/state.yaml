hen **B7-writer** (`step/write_context.rs:314`, `step/format.rs:500`, `geom2d_convert.rs:77`), then **B7-mesh_to_brep**, then the B6 leftovers. **Eleventh cycle (package P010) closed the first B7-writer line**: `GeomToStep_MakeBoundedCurve.cxx:44-51` writes a periodic B-spline through a non-periodic copy (`BS = B->Copy(); BS->SetNotPeriodic()`) and the port skipped that step, so a periodic B-spline kept its periodified knot vector. `step/write_context.rs` now has `bounded_bspline_of_curve` (the whole `cxx:42-62` arm, keyed on `C->IsPeriodic()` at `cxx:45`) and `open_periodic_bspline` (the `Copy()` + `SetNotPeriodic()` pair, needed because the port's `GeomBSplineCurve::new`/`rational` constructors always build the non-periodic form); the trimmed-B-spline arm of the same writer now restores `B->IsPeriodic()` on the basis copy so `Geom_BSplineCurve::Segment` reaches its periodic branch (`Geom_BSplineCurve.cxx:606-618`), matching `MakeCurve.cxx:71-76`. The UNPORTED note for that arm is deleted. Gates for P010: occt-topo --all-targets 0 errors, `occt-topo --lib` 1251/0, `phase4_integration` 9/9, `step_obj_gates` 4/4 (115s), `export_data_obj` 15/15 with v/f and bbox identical to the T002 table (screw 601/792, Shape-1 3335/4328, Shape-2 3081/4744 are the frozen baseline numbers; the older `data/occ-*.obj` exports for those three are not the baseline). One follow-up registered: `write_bspline_curve`'s `closed` flag and the curve/surface `KnotSpec` are still hard-coded in `step/format.rs` (`MakeBSplineCurveWithKnots.cxx:42-50`, `:71-87`, `MakeBSplineSurfaceWithKnots.cxx:127-150`), and their dependencies (`Geom_BSplineCurve::IsClosed`, `BSplCLib::KnotDistribution`) have no port yet. **Twelfth cycle (package P011) then closed that very follow-up**: `occt-core/src/bspl/knot_analysis.rs` ports `BSplCLib::KnotForm`/`MultForm`/`KnotAnalysis` (`BSplCLib.cxx:602-753`), `occt-geom` gains `GeomBSplineCurve::is_closed`/`knot_distribution` and `GeomBSplineSurface::u_knot_distribution`/`