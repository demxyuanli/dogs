distances `9, 1, 25, 9`); no test was added. Gates for P018: `occt-geom2d --lib` 72/0, `occt-geom --lib` 143/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 (150.7s), `export_data_obj` 15/15 with every per-model v/f and bbox identical to the T002 table; commit `8cad6a01`. Next pick: **B6e's 3D twin** (`occt-geom/src/extrema_cc/curve_curve.rs::locate_extcc` still calls `refine_curve_curve`; the 3D `Extrema_GFuncExtCC` + the same `Extrema_GenLocateExtCC` template, with `math_FunctionSetRoot` already ported and a live consumer), then B6f, B6d, B7-writer-4, `surface_fit`, and the missing data-driven STEP-write harness. **Twentieth cycle (package P019 / T-149) closed B6e's 3D twin, the last piece of the B6e line**: `crates/occt-geom/src/extrema_cc/curve_curve.rs::locate_extcc` no longer calls the self-invented Newton. The old path was `refine_curve_curve` -- a clamped 32-iteration loop with a `1e-12` convergence test, none of which the cxx has -- plus a local `f_and_jac` in `extrema_cc/poly_roots.rs` whose Jacobian had all four sign-bearing terms flipped relative to `Extrema_GFuncExtCC::Values`. It now builds `ExtremaLocateExtCC::new(c1, c2, u0, v0)` and reads `is_done()` / `point()`. Three new files land the chain: `extrema_cc/gfunc_ext_cc.rs` is the 3D monomorphisation of `Extrema_GFuncExtCC` as a `MathFunctionSetWithDerivatives` (`SearchOfTolerance` `hxx:150-197`, the `GetType` switches `hxx:263-291`, `Value` `hxx:359-550` with the singular-`D1` three-point / `DN` reconstruction, `Values` `hxx:568-827`, `GetStateNumber` `hxx:832-870`, `Points` `hxx:885-895`, `SubIntervalInitialize` `hxx:899-925`), `extrema_cc/p_on_curv.rs` is `Extrema_POnCurv` (`Extrema_POnCurv.hxx:25-60`), and `extrema_cc/gen_locate_ext_cc.rs` is `GenLocateExtCC` = `Extrema_LocECC` = `Extrema_GenLocateExtCC` (`Extrema_GenLocateExtCC.hxx:49-110`) plus `ExtremaLocateExtCC` = `Extrema_LocateExtCC.cxx:24-74`; `math_FunctionSetRoot` was already ported. Both invented functions are deleted. Gates for P019