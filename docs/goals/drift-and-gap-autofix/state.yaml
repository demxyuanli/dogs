    commit: "0a185eb5 fix(occt-geom): port the H-driven near-parallel refinement and the IntAna_IntConicQuad parallel decision in the IntAna_QuadQuadGeo plane/cylinder arm (IntAna_QuadQuadGeo.cxx:543-723) and pass IntPCy's face height H (IntPatch_ImpImpIntersection.cxx:2579-2588); mark the unported extreme-conic tail (cxx:922-951; T-160)"
    title: "`IntAna_QuadQuadGeo` 剩余五臂逐行对拍（T-160）：Pln/Cylinder 补齐 `H` 驱动的近平行细化臂与 `IntAna_IntConicQuad` 并行判定（含消费方 `IntPCy` 的 `H = VMax - VMin`）；Pln/Cone 的极端圆锥 tail（`cxx:922-951`）标 UNPORTED；Cylinder/Cylinder、Cylinder/Cone、Cone/Cone 三臂逐行核对为忠实"
    files:
      - "crates/occt-geom/src/intana/analytic_intersections.rs"
      - "crates/occt-geom/src/intana/line_torus.rs"
      - "crates/occt-geom/src/intana/tests.rs"
      - "crates/occt-topo/src/intpatch_impimp_pairs.rs"
      - "crates/occt-topo/src/int_face_face_analytic.rs"
      - "crates/occt-topo/src/intpatch.rs"
      - "crates/occt-topo/src/int_face_face_tests.rs"
      - "crates/occt-topo/examples/zz_bop_curved_probe.rs"
    closed_inventory_lines:
      - "**Pln/Cylinder（`IntAna_QuadQuadGeo.cxx:543-723`）两处真缺口，已修**：(1) 并行判定原先只看 `|axis . normal| < Tolang`（由平面系数与柱轴方向内联算出的 `direc`），cxx 用的是 `IntAna_IntConicQuad(axec, P, tolang, toltang, H).IsParallel()`（`cxx:601`）——在 `H != 0` 时该判定还要过 `Len` 端点距离检查，故两者在有限高的柱面上并不同义。(2) 更关键的是 `H` 参数整段缺失：旧 Rust 签名只有 `(p, cyl, tol_ang, tol)`，文件里的旧注释直接写明 `(H = 0, so the near-parallel direction-refinement branch is skipped)`，即把 `cxx:568-598` 的近平行细化臂声明为省略。该臂在 `dA > pi/4` 且 `dangle = |dA - pi/2| > Tolang` 时按 `sinda = |sin(dangle)|` 与面高 `H` 决定是否把截面从椭圆改判为直线：`dif = |sinda - Tol| < Tol` 或 `H > 0 && sinda * H < 2 * Tol` 时把 `tolang` 放宽到 `sinda * 2`、`toltang` 放宽到 `max(Tol, sinda * H * 1.01)` 并置 `newparams`。现全部落地：`quadric_quadric_plane_cylinder` 增加 `h: f64`（= `cxx:546` 的实参，`hxx:94` 的默认值 0），逐行移植 `cxx:568-598`；并行与否改由忠实件 `IntAnaIntConicQuad::line_plane(&axec_lin, p, tolang, toltang, h)` 回答（`cxx:559` 的 `gp_Lin axec(Cl.Axis())` 对 `cxx:601` 的构造）；`newparams` 的两条重算方向臂按 `cxx:617-631`（切线单直线：沿轴 100 单位的点 `t`、`distt = A*tx + B*ty + C*tz + D`、投影点 `p1`、`gp_Dir dd1(vv1)`）与 `cxx:647-668`（双直线：`arg = r^2 - distt^2`、`ht = arg > 0 ? sqrt(arg) : 0`（`cxx:654-655` 的钳位）、`omega1`、`ppt1/ppt2`、两条方向）移植；非并行臂的圆心改取 `inter.point(1)`（`cxx:687`），不再走本地 `line_plane` 助手。`gp_Dir` 的 `Standard_ConstructionError`（`cxx:629` / `:659` / `:665`）由既有的 `GpDir::from_vec(..)` `Err` 臂承担。"
      - "**Pln/Cylinder 的消费方 `IntPCy` 也缺 `H`，一并修**：`crates/occt-topo/src/intpatch_impimp_pairs.rs` 的 `int_p_cy` 原先不传面高，等于每对平面/柱面都按 `H = 0` 求解。cxx 在 `IntPatch_ImpImpIntersection.cxx:2579-2587` 按 `Reversed` 选 `S1`/`S2` 后取 `aSCyl->FirstVParameter()/LastVParameter()`，两端都有限时 `H = VMax - VMin`，任一端无限时 `0`。现 `int_p_cy` 接收 `uv1`/`uv2`（`int_intersect_pair` 已经算好），按 `reversed` 取对应一侧的 `v0`/`v1`，用 `Precision::is_negative_infinite` / `is_positive_infinite` 复现该判据。其余 6 处调用点（`int_face_face_analytic.rs` 的平面/柱面快速路径、`intpatch.rs` 与 `int_face_face_tests.rs` 的测试、`zz_bop_curved_probe` 探针、`intana/tests.rs` 两处、`quadric_quadric` 分发器）显式传 `0.0`，即 `hxx:94` 的默认实参，并在注释里写明理由（这些调用点没有持有面高的 `IntPCy` 上游）。"
      - "**Pln/Cone（`cxx:752-972`）尾部一段未移植，已按门禁第 2 条标 UNPORTED（未改行为）**：`cxx:922-951` 在四种圆锥曲线结果之后做「过于极端」的回绝 —— `IntAna_Ellipse` 且 `|param1|` 或 `|param1bis|` 超过 `EllipseLimit = 1.0E+9`（`cxx:926,929`，任意 `nbint`）、`IntAna_Hyperbola` 且任一参数超过 `HyperbolaLimit = 2.0E+6`（`cxx:935-950`，`nbint >= 1` 与 `nbint >= 2` 两处）—— 命中即 `done = false; return;`，让调用方改用双参数方法。所有消费方都把它翻成 `return false`（`IntPatch_ImpImpIntersection.cxx:3480-3483` 是 `Pln`/`Cone` 那处），整个 `Perform` 保持未完成，即本仓 `PairOutcome::Fail`；`cone_cone_analytic` 分支 2 也用 `INTER_QUAD_PLN.IsDone()`（`cxx:1556`）判这次嵌套调用。本仓 `QuadricIntersection` 枚举没有「未完成」态，映射到 `None` 会等于 `IntAna_Empty`（语义正好相反：无交），故该段只标行号不翻译，理由写在 `quadric_quadric_plane_cone` 的函数文档里。要真正补齐需要给枚举加「declined」态并同步 6 处穷举匹配，属单独一片。"
      - "**Cylinder/Cylinder（`cxx:1050-1293`）逐行核对为忠实**：`AxeOperator` 用 `(myEPSILON_CYLINDER_DELTA_DISTANCE = Precision::Confusion(), myEPSILON_AXES_PARA = Precision::Angular())`（`cxx:68-73`，与 Rust `axe_operator(.., CONFUSION, ANGULAR)` 一致）；并行臂的 `RmR <= Tol -> Same`、`DistA1A2 > R1pR2 + Tol -> Empty`、`R1pR2 - DistA1A2 <= RealSmall()` 单切线（= `REAL_SMALL`，P015 已修）、`DistA1A2 > RmR` 双直线（含 `aSin2` 与 `4*R1^2*aSin2 < Tol^2` 的相切合并、`aCos/aSin` 两次旋转）、`DistA1A2 > RmR - Tol` 单线、其余 `Empty` 五臂逐一对应；非并行臂的 `RmR_Relative <= myEPSILON_CYLINDER_DELTA_RADIUS`（`cxx:356`，Rust 字面量 `1e-13` 带 `cxx:1224` 出处注释）与 `A1A2.Intersect()`（= `coplanar`）、两椭圆的 `A = |sin(ang/2)|` / `B = |sin((pi - ang)/2)|` 与 `param1/param1bis` 交换、以及 `|DistA1A2 - R1 - R2| < Tol` 的外切点臂（`cxx:1272-1291`）均一致。"
