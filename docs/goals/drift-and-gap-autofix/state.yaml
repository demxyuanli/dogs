tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Rebuild the live drift-and-gap inventory from the registered sources and re-verify every line against the cxx; produce a ranked list of items whose OCCT counterpart branch exists and is missing or divergent in Rust."
    inputs:
      - "specs/occt-scope-drift.canvas.tsx"
      - "specs/_audit/_index.md (sections 9.1-9.4)"
      - "specs/_audit/topo-rest.md"
      - "specs/_audit/occt-geom.md"
      - "specs/_audit/occt-core.md"
      - "specs/_audit/bop-boolean.md"
      - "specs/_audit/mesh-exchange.md"
      - "specs/_tasks.md"
      - "specs/_a3n00_gap_analysis.md"
      - "D:/source/occt-src/src"
    constraints:
      - "Read-only. Do not edit any file."
      - "Do not run step_obj_gates or export_data_obj in this task; they are slow."
      - "Do not write new tests."
      - "Re-verify each candidate against the cxx by grep; use grep physical line numbers, not wrapped read-tool line numbers."
      - "Classify each line as: live (cxx branch exists, Rust missing or divergent) | closed (already faithful, keep with evidence) | permanently-unported (cxx branch exists but its dependency is out of scope; name the dependency)."
      - "Flag every banned construct found while scanning: area ratio, length filter, volume gate, per-model special case, or sampled substitute standing in for a downcast or a closed form."
    expected_output:
      - "Inventory table: id, area, cxx file:line, Rust file:line, class, severity, minimal same-branch fix."
      - "Ranked top 3 candidate Worker slices with allowed_files, verify, stop_if (advisory for T003)."
      - "Banned-construct list with locations."
      - "Side findings for report only."
    receipt:
      result: done
      executed_by: "PM inline (four parallel read-only Scout passes; no dedicated agent installed)"
      summary: "Inventory rebuilt in notes/T001-inventory.md. 24 registered findings are already CLOSED (docs stale: topo-rest 1/4/6/11 and the classifier half of 18, bop 1-4/7/8-10/16/17, mesh 1-14/19/19b, geom/core mains). 8 LIVE drift clusters ranked (B1-B8) and ~115 UNPORTED markers bucketed A-D with 9 reachable leaf items. Banned constructs: no area-ratio/length-filter/volume-gate anywhere; the sampled-substitute family is concentrated in wire_splitter_block (B1), bbox_from_geometry (B3, unregistered), extrema_* (B6), deflection/param_set, hlr, solid_union, brepfeat revolve."
      note: notes/T001-inventory.md
      coverage: "4 Scout passes: (1) topo-rest findings 1,3,4,5,6,8,9,10,11,15,17,18; (2) occt-geom + occt-core in full + pc_curve_kind; (3) bop-boolean + mesh-exchange in full; (4) every UNPORTED marker across the five crates' src trees."
      evidence:
        - "specs/occt-scope-drift.canvas.tsx (SEMANTIC/CLOSED/DOCDRIFT/GATES arrays)"
        - "specs/_audit/_index.md sections 9.1-9.4 and the five per-area audit docs"
        - "D:/source/OCCT-src/src greps for every cited cxx line"
        - "working-tree greps for every cited rust line and for the absence of the closed symbols"
      spawned_tasks:
        - T003
      side_findings:
        - "The drift canvas SEMANTIC array over-reports: 24 registered lines are already closed."
        - "bbox_from_geometry.rs sampled bbox is a live construct no audit doc registers."
        - "Two parallel GeomAdaptor_Surface::U/VResolution implementations; only wire_splitter_block is hand-rolled."
        - "validate.rs stub coexists with the real brep_check.rs port and must not be used as a gate."
        - "occt-math newton_minimum.rs already faithfully ports math_NewtonMinimum, so the globoptmin.rs:590 and newton.rs:81,91 markers are stale."

  - id: T002
    type: scout
    assignee: Scout
    status: queued
    reasoning_hint: default
    objective: "Freeze the gate baseline as measured numbers so later packages compare against measurement, not memory."
    inputs:
