he port now re-maps exactly that way (`TwoLines(l, l)` for either nested line case, `None` for the rest). The citations: `quadric_quadric_cylinder_cylinder`'s `(r1 + r2 - dist) <= f64::EPSILON` is `cxx:1104`'s `RealSmall()` (now `occt_core::precision::REAL_SMALL`; `f64::EPSILON` is `RealEpsilon()`, correct only at `cxx:1394`), and `rmr_relative <= 1e-13` now carries its `myEPSILON_CYLINDER_DELTA_RADIUS` (`InitTolerances`, `cxx:356`) and `A1A2.Intersect()` (`cxx:1224`, equal to `coplanar` off the parallel branch) provenance in a comment. Gates for P015: `occt-geom --all-targets` 0 errors, `occt-geom --lib` 143/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 (159.4s), `export_data_obj` 15/15 with every per-model v/f and bbox identical to the T002 table. The audit (`occt-geom.md` section 8, `_index.md` A15) and the drift canvas were corrected in the same cycle. Next pick: the cone/cone branch 4 the same audit line still leaves unported -- "two cones sharing a generatrix" (`IntAna_QuadQuadGeo.cxx:1759-1886`: the apex-on-the-other-cone test via `ElSLib::Parameters`/`Value`, `myCommonGen`/`myPChar`, the maximal plane, the nested reduce, and the `cxx:1836-1881` re-mapping which has no `IntAna_Line` case), which needs `myCommonGen`/`myPChar` plumbed into the port's `QuadricIntersection` and consumer (`int_face_face_analytic.rs::cone_cone` currently falls back to the numeric tracer on `None`), then B7-writer-4 (`geom2d_convert.rs:77` conic arms), then the B6 leftovers (B6e/B6f/B6g/B6d), the `surface_fit` / `GeomLib_IsPlanarSurface` port, and the missing data-driven STEP-write harness against `data/occ/*.st*`. **Sixteenth cycle (P015) re-verified the whole `IntAna_QuadQuadGeo` file**: cylinder/cone (`cxx:1324-1342`) and cylinder/cylinder (`cxx:1050-1293`) turned out to be ported already (the prior hand-off's "unported classification arms" claim was stale, corrected in the audit and canvas), and the real fix was the cone/cone parallel arm's nested-result re-mapping (`cxx:1557-1603`) plus two threshold citations (`RealSmall()` at `cxx:1104`, `myEPSILON_CYLINDER_DELTA_RADIUS` at `cxx:356`); gates all at baseline (`step_obj_gates` 4/4 in 159.4s, `export_data_obj` 15/15 bit-identical). The board again stays at active_task T005, with the cone/cone branch 4 (`cxx:1759-1886`, `myCommonGen`/`myPChar`) as the next slice. **Seventeenth cycle (package P016 / T-146) closed that slice**: `quadric_quadric_cone_cone`'s branch 4 is ported whole (`ElSLib` apex-membership round trip, `aGen`/`myPChar`, the maximal-plane normal's three branches including the `Something wrong ???` exit, and the nested `IntAna_QuadQuadGeo(anIntPln, Con1, Tol, Tol)` re-mapped by `cxx:1833-1881`, whose switch has no `IntAna_Line` arm), the return type became `ConeConeAnalytic { inter, common_gen }`, a new `lin_lin_square_distance` = `gp_Lin::SquareDistance` was added, and the consumer side landed as `intpatch_impimp_glines::with_cone_common_gen`, which appends the apex-to-apex generatrix (`IntPatch_ImpImpIntersection.cxx:9149-9171`) and attaches the `aPChar` vertex at parameter `0.` to every conic of the arm (`cxx:8869-9017`). Gates for P016: `occt-geom`/`occt-topo` `--all-targets` 0 errors, `occt-geom --lib` 143/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 (143.4s), `export_data_obj` 15/15 bit-identical. The `cxx:1805-1811` exit leaves `myCommonGen` true while its preceding `IntAna_NoGeometricSolution` arm (`cxx:9022-9140`) is unported, so that path is annotated in the source and reports no solution; and the branch is not exercised by any of the 15 export models (instrumented run: zero hits). Next pick: **B6e** (`locate_extcc2d`'s invented Newton vs `Extrema_LocateExtCC2d`/`Extrema_LocECC2d`/`Extrema_GenLocateExtCC`/`Extrema_GFuncExtCC` + the already-ported `math_FunctionSetRoot`), the largest remaining faithful port with a live consumer, then B6g, B6f, B6d, B7-writer-4, `surface_fit`, and the missing data-driven STEP-write harness. **Eighteenth cycle (package P017 / T-