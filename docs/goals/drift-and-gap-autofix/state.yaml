      - "**P030 留下的 `UNPORTED cxx:922-951` 已翻译，靠新增的枚举态**：`pub enum QuadricIntersection`（`crates/occt-geom/src/intana/analytic_intersections.rs:188-210`）增 `NotDone` 变体，文档注释写明它是 `done = false`（调用方必须改用双参数方法，而不是读一条曲线），并在 `PartialEq` 里与自身相等。cxx 该段的两条判据按原值落地为具名常量 `ELLIPSE_LIMIT = 1.0e9`（`cxx:927` 的 `EllipseLimit`）与 `HYPERBOLA_LIMIT = 2.0e6`（`cxx:928` 的 `HyperbolaLimit`）。"
      - "**`quadric_quadric_plane_cone` 的 tail 实现口径**：函数体由 `if/else if/else` 改成 `let res = if ... else ...;`，随后按 `cxx:922-951` 判回绝 —— `cxx:926-934` 判 `IntAna_Ellipse`（`nbint >= 1`）的 `|param1| > EllipseLimit || |param1bis| > EllipseLimit`、`cxx:935-942` 判 `IntAna_Hyperbola`（`nbint >= 2`）的 `|param2| / |param2bis| > HyperbolaLimit`、`cxx:943-951` 判 `IntAna_Hyperbola`（`nbint >= 1`）的 `|param1| / |param1bis| > HyperbolaLimit`，命中即 `done = false; return`。本仓没有 `param1/param2` 这些局部量：椭圆臂存的是 `GpElips::new(pos, radius /*= param1 = MajorRadius*/, minor /*= param1bis = MinorRadius*/)`，两条双曲线臂存的是 `GpHypr::new(pos, major /*= param1 = param2*/, minor /*= param1bis = param2bis*/)`（`cxx:850-851` 的轴含平面臂与 `cxx:901-902` 的 `cost < sina` 臂，两臂都置 `nbint = 2` 且两对参数相等），故 `cxx:935-942` 与 `cxx:943-951` 两段在本题上等价，合并成一次 `major/minor` 判据，理由写进函数文档与行内注释。回绝只可能在 else 分支的椭圆/双曲线臂触发（顶点平面臂只产 `Line`/`TwoLines`/`Point`），所以「在返回的曲线上判」与 cxx「在函数尾判」等价。"
      - "**消费路径一：`IntPCo` 的 `!IsDone()`**：`crates/occt-topo/src/intpatch_impimp_glines.rs::from_quadric_intersection` 增 `NotDone => PairOutcome::Fail`，即 `IntPatch_ImpImpIntersection.cxx:3480-3483` 的 `if (!inter.IsDone()) { return false; }`；`PairOutcome::Fail` 在 `intpatch_impimp.rs:115` 不置 `status`、不置 `empty`，于是整对曲面交给双参数方法，与 cxx 的 `return false` 同义。这是 `int_p_co`（平面/锥）唯一的生产判定点。"
