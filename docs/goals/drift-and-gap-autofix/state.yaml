      note: "Tenth cycle (T-139) closed as package P009 with all four gates at baseline; gates (3)(4) were re-run because `osculating_surface` sits on the `brep_offset` path. The board stays at active_task T005 so the next slice can be picked up directly. The cycle also re-verified three previously-listed items as already closed/stale (B1 via T-131; the `extrema_cc/mod.rs` and `globoptmin.rs` markers), which is recorded in the inventory. Eleventh cycle (P010) closed the first B7-writer line (the `GeomToStep_MakeBoundedCurve.cxx:44-51` periodic arm); the board again stays at T005 with B7-writer-3 (the `closed` flag and `KnotSpec`) as the next slice. Twelfth cycle (P011) then closed B7-writer-3, completing the STEP B-spline writer family; the next slice is B8-intana (live via `intcurvesurface/solvers.rs:456`), with B7-writer-4 (`geom2d_convert.rs:77`) and the B6 leftovers behind it. Thirteenth cycle (P012) reopened B8-intana and closed its solver half: the board's rationale for that slice (\"the port already has `math_DirectPolynomialRoots`, so no new dependency is needed\") turned out to hide the real defect -- the class WAS ported as `occt_core::math_direct_poly_roots::DirectPolynomialRoots` (used by `intquadquad`, `intana2d`, `math_trig_roots`), but `intana/analytic_intersections.rs` and `occt-math/polynomial.rs` each carried a second, invented solver behind a stale header comment (\"occt-geom does not depend on occt-math\" -- it does, on both `occt-math` and `occt-core`). Both now delegate through three new `Value(1..NbSolutions)` adapters in `occt-core/src/math_direct_poly_roots.rs`, and the invented Durand-Kerner `polynomial_roots` (no OCCT counterpart, no callers) is deleted. What the slice hand-off called \"the invented quartic-root thresholds\" is therefore only half closed: the `intana` and `occt-math` copies are gone, while `extrema_pc`, `extrema_cc`, `extrema2d` and `occt-core/numeric.rs` still carry byte-similar copies, and the cone/cone `1e-14` is untouched. Both are now written into `next.slice`. **Fourteenth cycle (package P013) closed the copy half of that hand-off**: the four remaining byte-similar solvers are gone -- `occt-geom/src/extrema_pc/poly_roots.rs` and `extrema_cc/poly_roots.rs` (local quadratic closed form + `poly4`/`polish4` Newton polish), `occt-geom2d/src/extrema2d/analytic_solvers.rs` (same, plus its own `poly4`) and `occt-core/src/numeric.rs` (`quadratic_roots`/`cubic_roots`, a fourth invented solver with a monic 3-arg cubic and sorted output, no callers outside its own two tests). All three live copies now `pub(super) use occt_core::math_direct_poly_roots::{cubic_roots, quadratic_roots, quartic_roots}`; the two `occt-core/numeric.rs` helpers and their two tests are deleted. Thresholds that disappeared with them: the `1e-14` discriminant cuts, the `1e-12`/`1e-9`/`1e-8`/`1e-6` dedup and residual filters, the `1e-300` leading-coefficient cuts and the local Newton polish; the stale headers claiming `occt-geom does not depend on occt-math` / `occt-geom2d does not depend on occt-geom` went too. One existing assertion that compared the invented ascending order (`extrema_pc/tests.rs:146-152`) was realigned to compare the solver's `Value` list as a set, matching the adjacent cubic/quartic assertions (no test added). Gates for P013: `--all-targets` 0 errors for occt-core/occt-geom/occt-geom2d, `occt-core --lib` 283/0 (-2: the two invented tests deleted), `occt-geom --lib` 143/0, `occt-geom2d --lib` 72/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4, `export_data_obj` 15/15 with per-model v/f identical to the T002 table; commit `8db13d5c`. **Fifteenth cycle (package P014) closed the second B8-intana line, the cone/cone tolerance**: `quadric_quadric_cone_cone` took an extra `tol_ang` parameter and used it as the branch-2 threshold, so every caller decided cone/cone alignment with its own constant (`TOL_ANG = 1e-8` in the BOP pair table, `Precision::Angular()` elsewhere) while `IntAna_QuadQuadGeo::Perform(gp_Cone, gp_Cone, Tol)` (`IntAna_QuadQuadGeo.cxx:1433-1476`) has exactly one input tolerance and derives the angular one. The parameter is gone and the cxx derivation is ported: `aTolAng` starts at `myEPSILON_ANGLE_CONE` (`= Precision::Angular()`, `InitTolerances`, `cxx:351-359`) and is relaxed to `Tol / EstimDist(Con1, Con2)` clamped to `[Precision::Angular(), Tol]`, only when `|tg1 - tg2| < Tol`, `A1A2.Parallel()` and `A1A2.Distance() > 100 * Tol`. `EstimDist` itself (`cxx:260-326`) is ported: the plane through both apexes and the first cone direction (`gce_MakePln(P1,P2,P3)`, `gce_MakePln.cxx:76-92`, `Precision::Infinite()` when not done), both axes projected into it (`ProjLib::Project(gp_Pln, gp_Lin)` = `ProjLib_Plane::Project`, `ProjLib_Plane.cxx:102-107`), each rotated by `+-SemiAngle`, the four line pairs intersected with the ported `IntAna2d_AnaIntersection::Perform(gp_Lin2d, gp_Lin2d)` and `max(min|ParamOnFirst|, min|ParamOnSecond|)` returned. The line projection needed one new faithful helper, `occt-geom/src/projlib.rs::project_pln_lin2d` (built on the existing `eval_pln_pnt2d`/`eval_pln_dir2d` = `ProjLib_Plane.cxx:87-97`; `None` where OCCT's `gp_Dir2d` would raise `Standard_ConstructionError`) -- the cone/cone branch is its only caller. `cxx:1555` was also realigned: the nested plane/cone reduce inside branch 2 is constructed with `(Tol, Tol)`, not with an angular tolerance. Call sites updated: the `intana` dispatcher, `intpatch_impimp_pairs::int_co_co`, `int_face_face_analytic::cone_cone`, and the two existing `intana/tests.rs` cone/cone assertions (no test added). Gates for P014: `--all-targets` 0 errors for occt-geom/occt-topo, `occt-geom --lib` 143/0, `occt-geom2d --lib` 72/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 (190.0s, 23 area ratios matching), `export_data_obj` 15/15 with every v/f and bbox identical to the T002 table (Cone 195/301, Shape-1 3335/4328, Shape-2 3081/4744, Shape 6150/11372, linkrods 3494/5078, screw 601/792); commit `dd31babc`. The same commit removed the dead re-exports P013 left behind (`intana/analytic_intersections.rs`'s `cubic_roots` + unused `super::*`, `extrema2d/analytic_solvers.rs`'s `quadratic_roots`). With P013 and P014 the B8-intana item is fully closed: no second root-finding path and no caller-supplied angular tolerance remain. The second cone/cone `1e-14` the audit named (`line_torus.rs:336,340`) is the `AxeOperator` constructor default (`theEpsDistance = 1.e-14`, `theEpsAxesPara = Precision::Angular()`, `cxx:69-72`) and `Same()` (`thedistance < myEPSILON_DISTANCE`, `cxx:83`) -- faithful, not drift. **Sixteenth cycle (package P015) reopened the same audit line's remaining item -- the `IntAna_QuadQuadGeo` \"unported classification arms\" -- and found the registration wrong**: `Perform(gp_Cylinder, gp_Cone)` (`IntAna_QuadQuadGeo.cxx:1324-1342`) is fully ported by `quadric_quadric_cylinder_cone` (coincident axes -> two circles at `apex +- r/tan(semiAngle)` along the axis, else `NoGeometricSolution`), `Perform(gp_Cylinder, gp_Cylinder)` (`cxx:1050-1293`) by `quadric_quadric_cylinder_cylinder` (the five parallel branches plus the equal-radius intersecting-axis ellipses and the external-tangency point), and the `cxx:1603` reference is a line inside the cone/cone branch 3 already ported by `cone_cone_common_apex`. What was actually wrong in those arms is one real semantic gap plus two threshold citations. The gap: the cone/cone parallel-equal-semi-angle arm returned the nested `quadric_quadric_plane_cone` result verbatim, where `cxx:1557-1603` re-maps it -- `Ellipse`/`Circle`/`Hyperbola` stay, an `IntAna_Line` (whichever `nbint` the nested call set) is reported as the same line twice (`pt1 = pt2 = H.Location()`, `dir1 = dir2 = H.Position().Direction()`, `nbint = 2`) and every other type (`Parabola`, `Point`, `Empty`) becomes `IntAna_NoGeometricSolution`; so a nested parabola or point used to be consumed as an exact intersection curve, and the line count did not match the cxx. The port now re-maps exactly that way (`TwoLines(l, l)` for either nested line case, `None` for the rest). The citations: `quadric_quadric_cylinder_cylinder`'s `(r1 + r2 - dist) <= f64::EPSILON` is `cxx:1104`'s `RealSmall()` (now `occt_core::precision::REAL_SMALL`; `f64::EPSILON` is `RealEpsilon()`, correct only at `cxx:1394`), and `rmr_relative <= 1e-13` now carries its `myEPSILON_CYLINDER_DELTA_RADIUS` (`InitTolerances`, `cxx:356`) and `A1A2.Intersect()` (`cxx:1224`, equal to `coplanar` off the parallel branch) provenance in a comment. Gates for P015: `occt-geom --all-targets` 0 errors, `occt-geom --lib` 143/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 (159.4s), `export_data_obj` 15/15 with every per-model v/f and bbox identical to the T002 table. The audit (`occt-geom.md` section 8, `_index.md` A15) and the drift canvas were corrected in the same cycle. Next pick: the cone/cone branch 4 the same audit line still leaves unported -- \"two cones sharing a generatrix\" (`IntAna_QuadQuadGeo.cxx:1759-1886`: the apex-on-the-other-cone test via `ElSLib::Parameters`/`Value`, `myCommonGen`/`myPChar`, the maximal plane, the nested reduce, and the `cxx:1836-1881` re-mapping which has no `IntAna_Line` case), which needs `myCommonGen`/`myPChar` plumbed into the port's `QuadricIntersection` and consumer (`int_face_face_analytic.rs::cone_cone` currently falls back to the numeric tracer on `None`), then B7-writer-4 (`geom2d_convert.rs:77` conic arms), then the B6 leftovers (B6e/B6f/B6g/B6d), the `surface_fit` / `GeomLib_IsPlanarSurface` port, and the missing data-driven STEP-write harness against `data/occ/*.st*`. **Sixteenth cycle (P015) re-verified the whole `IntAna_QuadQuadGeo` file**: cylinder/cone (`cxx:1324-1342`) and cylinder/cylinder (`cxx:1050-1293`) turned out to be ported already (the prior hand-off's \"unported classification arms\" claim was stale, corrected in the audit and canvas), and the real fix was the cone/cone parallel arm's nested-result re-mapping (`cxx:1557-1603`) plus two threshold citations (`RealSmall()` at `cxx:1104`, `myEPSILON_CYLINDER_DELTA_RADIUS` at `cxx:356`); gates all at baseline (`step_obj_gates` 4/4 in 159.4s, `export_data_obj` 15/15 bit-identical). The board again stays at active_task T005, with the cone/cone branch 4 (`cxx:1759-1886`, `myCommonGen`/`myPChar`) as the next slice. **Seventeenth cycle (package P016 / T-146) closed that slice**: `quadric_quadric_cone_cone`'s branch 4 is ported whole (`ElSLib` apex-membership round trip, `aGen`/`myPChar`, the maximal-plane normal's three branches including the `Something wrong ???` exit, and the nested `IntAna_QuadQuadGeo(anIntPln, Con1, Tol, Tol)` re-mapped by `cxx:1833-1881`, whose switch has no `IntAna_Line` arm), the return type became `ConeConeAnalytic { inter, common_gen }`, a new `lin_lin_square_distance` = `gp_Lin::SquareDistance` was added, and the consumer side landed as `intpatch_impimp_glines::with_cone_common_gen`, which appends the apex-to-apex generatrix (`IntPatch_ImpImpIntersection.cxx:9149-9171`) and attaches the `aPChar` vertex at parameter `0.` to every conic of the arm (`cxx:8869-9017`). Gates for P016: `occt-geom`/`occt-topo` `--all-targets` 0 errors, `occt-geom --lib` 143/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 (143.4s), `export_data_obj` 15/15 bit-identical. The `cxx:1805-1811` exit leaves `myCommonGen` true while its preceding `IntAna_NoGeometricSolution` arm (`cxx:9022-9140`) is unported, so that path is annotated in the source and reports no solution; and the branch is not exercised by any of the 15 export models (instrumented run: zero hits). Next pick: **B6e** (`locate_extcc2d`'s invented Newton vs `Extrema_LocateExtCC2d`/`Extrema_LocECC2d`/`Extrema_GenLocateExtCC`/`Extrema_GFuncExtCC` + the already-ported `math_FunctionSetRoot`), the largest remaining faithful port with a live consumer, then B6g, B6f, B6d, B7-writer-4, `surface_fit`, and the missing data-driven STEP-write harness. **Eighteenth cycle (package P01