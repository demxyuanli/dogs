      - "The cxx branch the fix needs does not exist or depends on an unported layer."
      - "Verification fails twice."
      - "The fix would require a predicate, area ratio, length filter, volume gate, or per-model special case."
    receipt:
      result: done
      executed_by: "PM inline (Worker role; no subagent installed)"
      changed_files:
        - "crates/occt-topo/src/wire_splitter_block.rs"
      summary: "THREE OCCT ARMS LANDED, NO NEW PREDICATE. (B1a) uv_tolerance_2d now forwards to occt_geom::approx_same_parameter::{u_resolution,v_resolution} -- the single faithful port of GeomAdaptor_Surface::U/VResolution (GeomAdaptor_Surface.cxx:1818-1958) that four other call sites already use -- and the hand-rolled per-class switch plus its fd_uv_tolerance finite-difference fallback are deleted. That also picks up the Geom_RectangularTrimmedSurface unwrap (cxx:423-430), the GeomAbs_OffsetSurface arms (cxx:1882-1885, :1944-1947), the cone unbounded guard (cxx:1855-1858) and the analytic cone radius S->VIso(V)->Radius() (cxx:1861-1866), and puts the revolution/extrusion arms on their basis curve's Resolution instead of t3/|dS/du|. (B1b) angle_2d now uses GeomLProp_CLProps2d::new(c, tv, 2, PConfusion()) + is_tangent_defined() + curvature() (BOPAlgo_WireSplitter_1.cxx:797-807) instead of the inlined |D1 x D2|/|D1|^3 helper curve2d_radius, whose guard compared |D1|^2 against PConfusion. (B1c) refine_angle_2d now takes aTV from vertex_parameter_on_face, i.e. the 3-arg BRep_Tool::Parameter(aV, aE, aFace) pcurve parameter (cxx:1060), instead of the 3D edge parameter; the function's UNPORTED note is removed. Dead leftovers from the same class (curve_resolution, the unused CurveKind and Curve2d imports) are deleted."
      commands:
        - cmd: "rtk cargo check --manifest-path crates/occt-topo/Cargo.toml --offline --all-targets"
          status: pass
          note: "0 errors, 373 warnings (baseline 375; the 2 removed are the dead CurveKind import and curve_resolution). occt-math 0/27, occt-geom2d 0/81, occt-geom 0/100, occt-core 0/8 also unchanged."
        - cmd: "rtk cargo test --manifest-path crates/occt-topo/Cargo.toml --offline --lib"
          status: pass
          note: "1251 passed / 0 failed, equal to the T002 baseline."
        - cmd: "rtk cargo test --manifest-path crates/occt-topo/Cargo.toml --offline --test step_obj_gates"
          status: pass
          note: "4 passed / 0 failed, equal to the T002 baseline."
        - cmd: "rtk cargo run --manifest-path crates/occt-topo/Cargo.toml --offline --example export_data_obj"
          status: pass
          note: "15 ok / 0 err with the vertex/face counts and bboxes bit-identical to the T002 baseline for all 15 models."
      evidence:
        - ".target-gate/t001/check.txt, lib.txt, gates.txt, gates-raw.txt, export-obj.txt"
        - ".target-gate/t000/* (the frozen T002 baseline these were compared against)"
        - "D:/source/OCCT-src/src/ModelingAlgorithms/TKBO/BOPAlgo/BOPAlgo_WireSplitter_1.cxx:768-840, :859-901, :1060"
        - "D:/source/OCCT-src/src/ModelingData/TKG3d/GeomAdaptor/GeomAdaptor_Surface.cxx:1818-1958"
        - "D:/source/OCCT-src/src/ModelingData/TKBRep/BRep/BRep_Tool.cxx:1519-1652"
      note: "Package committed; see the PM receipt T005."

  - id: T005
    type: pm
    assignee: PM
    status: active
    reasoning_hint: medium
    objective: "Rolling advance: after each verified Worker package, write the receipt and commit, then update the inventory and activate the next largest safe Worker package until the inventory is exhausted."
