      - "B7-mesh_to_brep: `mesh_to_brep.rs` carried three port-invented rules against `BRepBuilderAPI_MakeShapeOnMesh` (`BRepBuilderAPI_MakeShapeOnMesh.cxx:74-263`): a `1e-9` position-hash vertex dedup grid (`point_key`, `vertex_of_key`) where the cxx maps mesh nodes 1:1 (`cxx:96-111`, `aPnt2VertexMap.Add(i, aV)`), `Vertex` tolerance `0.0` where `BRepBuilderAPI_MakeVertex` is `BRepLib_MakeVertex` -> `BRep_Builder::MakeVertex(V, P, BRepLib::Precision())` with `BRepLib::Precision() = Precision::Confusion()` (`BRepLib_MakeVertex.cxx:26-31`, `BRepLib.cxx:84`), and a per-triangle face built by three locally oriented edges with an inline `(pb-pa) x (pc-pa)` normal, where the cxx keys shared edges on the canonical node-index pair (`cxx:31-55`, `cxx:150-179`), re-orients them on the triangle's traversal (`cxx:213-228`), takes the normal as `d1 x d2` of the first two edges' `BRepAdaptor_Curve::Line()` directions under `Precision::SquareConfusion()` (`cxx:238-247`) and puts the plane through `Node(anIdx[0])` (`cxx:255`). The whole class is now ported as `mesh_to_brep.rs::MakeShapeOnMesh` (`is_done` / `shape()` -> `Compound` / `faces()` / `edges()` / `vertices()`), covering the empty-mesh not-done exit (`cxx:80-85`), the index-degenerate skip (`cxx:126-130`), the `gp::Resolution()` geometric-degeneracy skip (`cxx:133-141`, `= REAL_SMALL`), the `NCollection_IndexedDataMap::Add` first-value semantics of the edge map (`NCollection_IndexedDataMap.hxx:494-501`), the `aHasAllEdges` guard (`cxx:204-211`) and the final `Done()` + `TopoDS_Compound` (`cxx:182-184`, `cxx:257-263`). `triangulation_to_brep` keeps only clearly delimited `LOCAL:` extensions: the position welding (`weld_nodes`, so a mesh repeating a corner per incident triangle still closes), the closed-2-manifold solid test, `OrientClosedSolid` and the divergence-theorem winding pass."
