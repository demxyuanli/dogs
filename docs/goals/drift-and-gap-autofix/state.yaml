      - "**消费路径三（本仓自设的解析快速路径）**：`crates/occt-topo/src/int_face_face_analytic.rs::conics_to_curves` 与 `crates/occt-topo/src/intpatch_analytic.rs::ic_list_from_quadric` 把 `NotDone` 归入「无曲线」臂（前者的 `Point(_) | Same | None`，后者的 `Parabola(_) | Hyperbola(_) | Point(_) | Same | None`）；`int_face_face_analytic::plane_cone` 在 `conics_to_curves` 空结果时回落 `self.general`（数值追踪 = cxx 的双参数方法）。"
    gates:
      check: "`cargo check --manifest-path crates/occt-geom/Cargo.toml --offline --all-targets` 0 errors / 105 warnings；`crates/occt-topo` 0 errors / 413 warnings；`crates/occt-core` 0 / 12、`crates/occt-math` 0 / 30、`crates/occt-geom2d` 0 / 82（五 crate 均与 T002 同数，无新增告警）"
