        rationale: "P030 closed the per-arm pass the way the previous four cycles suggested it would: the two arms nobody had ever read (`cxx:543-745` Pln/Cylinder and `cxx:752-972` Pln/Cone) both turned out to carry something, one a whole missing cxx arm plus a missing consumer parameter and the other an unported refusal block, while the three arms that had prior reviews (`cxx:1050-1293`, `cxx:1324-1342`, `cxx:1433-1886`) came back faithful. That is the third consecutive cycle in which reading an arm changed what the board believed, so P031 is picked as the smallest piece that can still change behaviour on this class: the `EllipseLimit`/`HyperbolaLimit` block is the only remaining cxx control flow of `IntAna_QuadQuadGeo` with no counterpart, and it is reachable from two different consumers, which is exactly why it must not be approximated by `None`. Deferring it to a later tranche would leave a known, cited, behaviour-bearing branch untranslated while the board declares the class done. P028's census was wrong in the direction that hides work and P029 is what caught it, which is the strongest argument for continuing the per-arm pass: the class is 15 overloads split across two files plus one `#[path]` module, so every aggregate statement about it (\"closed\", \"unported\", \"10 of 15\") has been wrong at least once. P029 settled the torus half and found a real invented branch there; the remaining five arms are the last place a similar construct can still be hiding, and two of them (`cxx:543-745` Pln/Cylinder and `cxx:752-972` Pln/Cone) are the largest of the whole class, while `cxx:1050-1293` (Cylinder/Cylinder) is the one whose only prior review was a citation check. Running the T999 audit before these five are read would repeat exactly the failure P027 and P028 both recorded. The census-method correction belongs in the same slice so the next reader does not re-derive `intana_torus.rs` from scratch."
