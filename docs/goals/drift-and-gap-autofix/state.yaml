    commit: "196463f7 extrema: math_GlobOptMin::computeLocalExtremum runs the real Newton/BFGS/Powell engines (math_GlobOptMin.cxx:266-339, math_Powell.cxx:107-229; T-173)"
    title: "`math_GlobOptMin::computeLocalExtremum` 的三条局部下降臂全部落地（`math_GlobOptMin.cxx:266-339`）：本仓原来只有 BFGS 臂在跑，且喂给它的是**自创的中心差分数值梯度**（`numeric_gradient`，h=1e-6），Newton 臂（`cxx:272-291`）与 Powell 臂（`cxx:314-336`）标 UNPORTED 直接跳过；两个 `dynamic_cast`（`cxx:273` 的 `math_MultipleVarFunctionWithHessian*`、`cxx:294` 的 `math_MultipleVarFunctionWithGradient*`）由 `has_hessian` / `has_gradient` 两个**布尔替身**冒充。本包：(1) `MathMultipleVarFunction` 新增 `as_gradient()` / `as_hessian()` 两个下转型 accessor，`MathMultipleVarFunctionWithGradient` / `...WithHessian` 各自覆盖返回 `Some(self)`，即 OCCT 的 `dynamic_cast` 的零开销等价物；`has_gradient` / `has_hessian` 两个字段与全部调用点删除，`GlobOptMin` 的 `perform` 改收 `&dyn MathMultipleVarFunction`。(2) Newton 臂接线 `NewtonMinimum::with_defaults` + `SetBoundary(myGlobA, myGlobB)`（`cxx:275-276`）+ `Perform`，`IsDone` 后按 `is_inside` 收候选（`cxx:277-291`）。(3) BFGS 臂改从 `a_tmp.gradient(x, &mut g)` 取真梯度，不再数值差分（`cxx:300` 的 `aGradient.Gradient(...)`），其余 `SetBoundary`（`cxx:299`）与 `theVal = bfgs.Minimum()`（`cxx:305`）保持原样。(4) Powell 臂接线：恒等方向矩阵 `I_n` + `Powell::with_tolerance(n, 1.0e-10)` + `perform(f, pnt, &m)`（`cxx:317-324` 的 `math_Powell(*myFunc, 1e-10)`），为此把 `math_Powell`（`math_Powell.cxx:107-229`）整份移植——`DirFunctionBis`（`cxx:35-78`）、`MinimizeDirection`（`cxx:80-105`，内部 `math_BracketMinimum` + `math_BrentMinimum(1.0e-10)`）、`cxx:192-226` 的位移收敛细化、`IsSolutionReached`（`math_Powell.lxx:18-22`）。(5) `math_BracketMinimum` 补上 `math_Powell::MinimizeDirection` 需要的**可失败目标** `Perform`（`perform_fallible`），原来的不可失败 `Perform` 改为委托它，两条路径的控制流合一。(6) 消费侧：`Extrema_GlobOptFuncCCC2` 在 3D（`occt-geom/src/extrema_cc/glob_opt_func.rs`）与 2D（`occt-geom2d/src/extrema2d/glob_opt_func.rs`）各自实现三级函数类，四处点–曲线 / 曲线–曲线调用点改传 `&func` 而不是闭包（T-173）"
