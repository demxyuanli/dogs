lete: scout (cxx re-read of Extrema_ExtPS/ExtCS/ExtSS/ExtElSS and of `ComputeUsingExtremum`), worker, four gates green, commit. **Eighth cycle (T-137 / package P007) then closed the classifier half of B6b**: `classify_plane`/`classify_sphere`/`reconstruct_line` in `occt-geom/src/extrema_surf/analytic_solvers.rs` now delegate to `s.gp_pln()` / `s.gp_sphere()` / `c.gp_line()` (`Extrema_ExtSS.cxx:117-129` dispatches on `S1.GetType()` and takes `S1.Plane()`/`S1.Sphere()`; `Extrema_ExtCS.cxx:129-140` takes `C.Line()`/`myS->Sphere()`/`myS->Plane()`), and the sampled bodies `is_planar` (8x8), `sphere_center` (circumcentre), `circumcenter`, `surface_normal`, `is_line` (6-point tangent) and `sample_bounds` are deleted (`det3`/`solve3` stay; `numeric_extrema.rs:205` uses them). In `occt-geom2d/src/extrema2d` the `is_line2d`/`circumcenter2d`/`classify_circle2d`/`line_of_curve2d` samplers are deleted: `point_curve_extrema2d_all` takes its line arm from `c.gp_lin2d()` and now computes `Mydist` the way `Extrema_ExtPElC2d.cxx:63-79` does (the parameter on the line measured from `L.Location()` along `L.Direction()` -- the old code used the increment relative to `d0(first_parameter)`, which is wrong on a trimmed line), its circle arm from `c.gp_circ2d()`, and `curve_curve_extrema2d_all` dispatches pairs with `gp_lin2d()`/`gp_circ2d()` (`Extrema_ExtCC2d.cxx:104-145`, `GetType(C1)` x `GetType(C2)` + `Extrema_Curve2dTool::Line/Circle`). Observable effect: a curve that is straight but is not a `Geom2d_Line`/`Geom_Line` (degree-1 B-spline, straightened trimmed curve) no longer falls into the analytic line arm, matching OCCT, which reports `GeomAbs_BSplineCurve` and takes the general arm. Two follow-ups were registered instead of being fixed in this package: **B6c** (the `span/0.1` seed grid `build_samples2d` plus `newton_point_curve_all2d` / `newton_curve_curve_all2d` are self-invented substitutes for `Extrema_GGExtPC::IntervalPerform`, `mysample = 17`, and for `Extrema_GGenExtCC` -> `math_GlobOptMin`; live via `brep_class/intersector_checks.rs:157` and `extrema2d/general_extrema.rs:550`) and **B6d** (the analytic sphere/sphere and sphere/plane arms of `surface_surface_extrema_all` have no counterpart in `Extrema_ExtSS::Perform`, which is analytic only for `Plane` x `Plane`). Gates for P007: `--all-targets` 0 errors for `occt-geom2d`/`occt-geom`/`occt-topo`, `occt-geom2d --lib` 72/0, `occt-geom --lib` 143/0, `occt-topo --lib` 1251/0, `step_obj_gates` 4/4 (117s), `export_data_obj` 15/15 with v/f and bbox bit-identical to the T000 baseline."
