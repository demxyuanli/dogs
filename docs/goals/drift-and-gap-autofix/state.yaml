      - "**`done` 载荷（audit `occt-geom.md` §9 的 (a) 项）**：新增 `pub struct LineTorusIntersection { done, points }`（`crates/occt-geom/src/intana/line_torus.rs:826-843`）—— `is_done()` = `IntAna_IntLinTorus::IsDone()`（`IntAna_IntLinTorus.lxx:18-21`）、`points()` = `NbPoints()`/`Value(i)` 的载荷（`lxx:23-44`，`!done` 时为空表）；`line_torus_intersect`（`line_torus.rs:851-924`）改返回该结构。原签名 `-> Vec<GpPnt>` 把 OCCT 的「求解器未完成」「有根但全为坏解」「真无根」三种情形混为同一个空表。"
      - "**改持求解器本体，不再经 `quartic_roots` 适配器**：`occt_core::math_direct_poly_roots::quartic_roots`（`math_direct_poly_roots.rs:724-726`）经 `solution_values`（`:703-711`）把 `!IsDone()`、`InfiniteRoots` 与零根都折成空 `Vec<f64>`，而 cxx 对「求解器未完成」（`cxx:126-131` 的 `done = false`）与「完成但零根」（`cxx:121-125` 的 `done = true`）给出相反的 `done`。故函数体直接持有 `DirectPolynomialRoots::new5(a4, a3, a2, a1, a0)`（`line_torus.rs:893`），先按 `cxx:89` 的 `if (mdpr.IsDone())` 分流，再按 `cxx:90-91` 走 `NbSolutions()`/`Value(i)` 循环（`line_torus.rs:897-899`）。"
      - "**两处 `done = false` 都落地**：`cxx:116-120` 的 `if (n > 0 && nbsolvalid == 0 && aNbBadSol == n) { nbpt = 0; done = false; }` 现按 `n > 0 && out.is_empty() && nb_bad_sol == n` 实现（`line_torus.rs:917-921`），坏解计数 `nb_bad_sol` 在回代判据 `p_sol_t.square_distance(&p) > 1.0e-10` 处分增（`cxx:99-106`，`line_torus.rs:911-914`）；`cxx:126-131` 的求解器未完成即 `done = false` 早退（`line_torus.rs:894-896`）。`cxx:121-125` 的完成态（含 `n == 0`）仍回 `done = true`（`line_torus.rs:923`）。"
      - "**消费方回落**：`crates/occt-topo/src/intcurvesurface/solvers.rs:456-465` 在 `!inter.is_done()` 时 `return None`，即 `IntCurveSurface_InterUtils.pxx:1290-1294` 的 `if (!intlintorus.IsDone()) { return false; }`；`ProcessLinTorus` 返回 false 后 `IntCurveSurface_Inter.pxx:578-581` 清 `isAnaProcessed`，该对曲面改走多面体干涉（本仓 `perform_curve_surface` 的 `polyhedron_path` 臂，`solvers.rs:179`、`:188-191`）。"
