      - "Only approve items with a same-branch cxx fix; reject anything needing a new predicate, area ratio, length filter, volume gate, or per-model case."
      - "Prefer a vertical slice that changes real geometry behavior over a cosmetic rename."
      - "Set allowed_files, verify and stop_if explicitly."
    expected_output:
      - "Decision: proceed | no_live_items"
      - "Exact T004 objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
    receipt:
      result: done
      executed_by: "PM inline (Judge role; no subagent installed)"
      decision: proceed
      rationale: "B1 is the largest safe useful slice in the inventory: three distinct OCCT arms of one class (BOPAlgo_WireSplitter_1.cxx:768-840 Angle2D, :859-901 Tolerance2D/UTolerance2D/VTolerance2D, :1060 RefineAngle2D) all land in one Rust file already on the live BOP path (wire_splitter.rs -> WireSplitter). Every arm has a same-branch cxx fix with the dependency already ported (approx_same_parameter::{u,v}_resolution for B1a, cl_props2d::GeomLPropCLProps2d for B1b, vertex_parameter_on_face for B1c), so no new predicate, threshold or lookup table is needed. B2/B3/B6 are larger but need a further Scout pass (B3 needs a BRepBndLib dependency check), and B5 is smaller. The slice is a genuine geometry behavior change (2D tolerance and 2D wedge angles fed to the wire splitter), not a rename."
      rejected:
        - "B4 face_sample_point: same-branch fix exists but touches four duplicated sites across BOP solids; not the largest safe first slice."
        - "Any item whose only change would be doc text, or that would delete a live construct without landing the cxx arm."
      approved:
        - "B1a uv_tolerance_2d -> occt_geom::approx_same_parameter::{u_resolution,v_resolution}; delete fd_uv_tolerance (GeomAdaptor_Surface.cxx:1818-1958)."
        - "B1b curve2d_radius -> GeomLPropCLProps2d is_tangent_defined/curvature (BOPAlgo_WireSplitter_1.cxx:797-807)."
        - "B1c refine_angle_2d aTV -> vertex_parameter_on_face, i.e. BRep_Tool::Parameter(aV,aE,face) (BOPAlgo_WireSplitter_1.cxx:1060)."
      t004_allowed_files:
        - "crates/occt-topo/src/wire_splitter_block.rs"
      t004_verify:
        - "rtk cargo check --manifest-path crates/occt-topo/Cargo.toml --offline --all-targets"
        - "rtk cargo test --manifest-path crates/occt-topo/Cargo.toml --offline --lib"
        - "rtk cargo test --manifest-path crates/occt-topo/Cargo.toml --offline --test step_obj_gates"
        - "rtk cargo run --manifest-path crates/occt-topo/Cargo.toml --offline --example export_data_obj"
      t004_stop_if:
        - "Need files outside allowed_files."
        - "The cxx branch the fix needs does not exist or depends on an unported layer."
        - "Verification fails twice."
        - "The fix would require a predicate, area ratio, length filter, volume gate, or per-model special case."
      note: "B2 (pc_curve_kind), B3 (bbox_from_geometry) and B6 (Extrema failure fabrication) are queued behind one more Scout pass each; B5 is a small self-contained follow-up."

  - id: T004
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Execute the T003-approved slice: port the three BOPAlgo_WireSplitter Angle2D / Tolerance2D / RefineAngle2D arms into crates/occt-topo/src/wire_splitter_block.rs (uv_tolerance_2d delegation, GeomLPropCLProps2d curvature, pcurve vertex parameter)."
