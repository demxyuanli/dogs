    closed_inventory_lines:
      - "`IntAna_QuadQuadGeo::Perform(gp_Pln, gp_Pln, TolAng, Tol)`（`IntAna_QuadQuadGeo.cxx:389-511`）的两处自创：其一，交点原点用 cxx 里不存在的最小范数公式 `p = (d1·(n2×v) + d2·(v×n1))/|v|²`（`v = n1×n2`）配合 `v2 < 1e-20` 的叉积长度门；其二，`cxx:449-508` 的小角原点重解整段未移植。现按 cxx 逐行落地：`denom = A1*A2 + B1*B2 + C1*C2`、`ddenom = 1 - denom²`、`denom = (|ddenom| <= 1e-16) ? 1e-16 : ddenom`（`aEps = 1.e-16`，`cxx:423-428`），`par1 = dist1/denom`、`par2 = -dist2/denom`（`cxx:430-431`），两法向投影 `inter1 = n1×vd`、`inter2 = n2×vd` 求和取半得 `pt1`（`cxx:433-444`），`dir1 = gp_Dir(vd)`（`cxx:445`）；`aMVD < aTreshAng = 2.e-6` 且 `|aDist1| > aTreshDist = 1.e-12 || |aDist2| > aTreshDist` 时（`cxx:460-470`），用两次 `IntAna_IntConicQuad` 直线/平面求解重算原点 —— `aL1 = gp_Lin(pt1, gp_Dir(aVN1))` 对 P1（`cxx:481-487`），`aDL2 = gp_Dir(dir1.Crossed(aDN1))`、`aL2 = gp_Lin(aPnt1, aDL2)` 对 P2（`cxx:489-506`），`!IsDone()` 或 `IsParallel()` 时 cxx 直接 `return`（`done` 保持 false），本仓对应 `None`。`plane_plane_line` 因此多收 `(tol_ang, tol)` 两个形参：`quadric_quadric_planes` 传自身实参；`cone_cone_common_apex` 内嵌套的平面/平面求解按 `cxx:1709` 传 `(Tol, Tol)`，失败即 `cxx:1710-1713` 的 `IntAna_NoGeometricSolution` ⇒ `None`。`IntAna_IntConicQuad::Perform(L, P, Tolang, Tol)` 即 `IntAna_IntConicQuad.hxx:104-108` 的五参重载取 `Len = 0`。"
