ther two when singular), the `Controle` acceptance test and the `FClass2d::perform_infinite_point() == FaceState::In` normal orientation; `brep_lib_make_face.rs::make_face_from_wire` is `BRepLib_MakeFace.cxx:188-256` (`tol = max(1.2 * ToleranceReached, Tolerance)` at `cxx:200`, the `OnlyPlane` degenerate-edge strip at `cxx:211-242`); `occt-core/src/gp/ax3.rs::GpAx3::from_point_dir` is `gp_Ax3.cxx:29-80`. `offset_wire_3d` is rewired to them, so the 4-samples-per-edge fit is off the `brep_offset` path. Left registered, not fixed: `occt-geom/src/surface_fit.rs`'s `fit_plane` / `fit_surface_kind` / `fit_surface` are port-only (no OCCT class) and have no production caller left after the rewire -- only their own tests."
