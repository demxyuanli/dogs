      - "**订正 P028 的普查错误**：P028 的 board 条目写「Torus 五臂在 `occt-geom/src/intana` 里没有函数、未移植 5 个」。该结论由只 grep `crates/occt-geom/src/intana/` 目录产生，漏掉 `crates/occt-geom/src/intana_torus.rs` —— 它由 `crates/occt-geom/src/intana/mod.rs:30-35` 的 `#[path = \"../intana_torus.rs\"] mod torus;` 与 `pub use torus::{...}` 引入。五个 Torus 臂全部已移植且全部有在仓生产消费方：`cxx:2163` Pln/Torus -> `quadric_quadric_plane_torus`、`cxx:2278` Cylinder/Torus -> `quadric_quadric_cylinder_torus`、`cxx:2357` Cone/Torus -> `quadric_quadric_cone_torus`、`cxx:2496` Sphere/Torus -> `quadric_quadric_sphere_torus`、`cxx:2588` Torus/Torus -> `quadric_quadric_torus_torus`；消费方为 `occt-topo/src/intpatch_impimp_pairs.rs:117/155/162/169/175` 与 `occt-topo/src/intpatch.rs:576`。故 `IntAna_QuadQuadGeo` 的 15 个 `Perform` 重载是 15/15 在位（此前 P027 用到的「10 已移植」也只是 grep 目录的产物）。教训写进清单：多臂类的普查要按 `mod` 声明走，不能只按目录；`intana_torus.rs` 这种 `#[path]` 外挂模块最容易被目录式 grep 漏掉。"
